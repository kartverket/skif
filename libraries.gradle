// Optional configuration of library versions to use.
// Simply add version properties to your gradle-user.property file to use this feature.
def libVersion(String name, String defaultValue) {
    project.ext.properties.get('version.' + name, defaultValue) //development mode only
}

ext.SLF4J_VERSION = libVersion('slf4j', '1.7.25')
ext.JAXB_VERSION = libVersion('jaxb', '2.2.7') // 2.2.10 har bug i håndtering av enum i Java-til-XSD
ext.JAXWS_VERSION = libVersion('jaxws', '2.2.8') // Nyeste versjon som ikke krever nyere JAXB
System.setProperty('javax.xml.accessExternalSchema', 'all') // JAXB 2.2.7 trenger visst denne


// build a map of the dependency artifacts to use. Allows centralized definition of the versions of artifacts to
// use. In that respect it serves a role similar to <dependencyManagement> in Maven
ext.libraries = [

        // Database
        ojdbc: "com.oracle.jdbc:ojdbc8:${libVersion('oracle', '12.2.0.1')}@jar",
        ojdbc_g: "com.oracle.jdbc:ojdbc8_g:${libVersion('oracle', '12.2.0.1')}@jar",
        c3p0: "com.mchange:c3p0:${libVersion('c3p0', '0.9.5.2')}",

        // Logging
        slf4j_api: "org.slf4j:slf4j-api:${SLF4J_VERSION}",
        jcl_to_slf4j: "org.slf4j:jcl-over-slf4j:${SLF4J_VERSION}",
        jul_to_slf4j: "org.slf4j:jul-to-slf4j:${SLF4J_VERSION}",
        log4j_to_slf4j: "org.slf4j:log4j-over-slf4j:${SLF4J_VERSION}",
        logback_classic: "ch.qos.logback:logback-classic:${libVersion('logback', '1.2.3')}",

        // Guice med extensions
        guice: "com.google.inject:guice:${libVersion('guice', '4.1.0')}",
        guice_multibindings: "com.google.inject.extensions:guice-multibindings:${libVersion('guice', '4.1.0')}",
        guice_throwingproviders: "com.google.inject.extensions:guice-throwingproviders:${libVersion('guice', '4.1.0')}",
        guice_assistedinject: "com.google.inject.extensions:guice-assistedinject:${libVersion('guice', '4.1.0')}",
        guice_grapher: "com.google.inject.extensions:guice-grapher:${libVersion('guice', '4.1.0')}",
        // guice-servlet depends on servlet-api som her er provided via weblogic og derfor ikke skal være med her
        guice_servlet: "com.google.inject.extensions:guice-servlet:${libVersion('guice', '4.1.0')}@jar",


        // Utility libraries
        guava: "com.google.guava:guava:22.0",
        jsr305: "com.google.code.findbugs:jsr305:1.3.9",
        xstream: 'com.thoughtworks.xstream:xstream:1.4.8',


        // Testing
        testng: dependencies.create('org.testng:testng:6.14.3') {
            exclude group:'junit' // vi benytter ikke JUnit i prosjektet [SKIF-385]
        },
        mockito: 'org.mockito:mockito-core:2.19.0', /* mockito 3.x for java 8 */
        dbunit: 'org.dbunit:dbunit:2.5.4',
        unitils: 'org.unitils:unitils-core:3.4.6',
        assertj: 'org.assertj:assertj-core:3.10.0',
        reflections: 'org.reflections:reflections:0.9.11',

        // JAXB
        jaxb_impl: "com.sun.xml.bind:jaxb-impl:${JAXB_VERSION}",

        jodatime: "joda-time:joda-time:${libVersion('jodatime', '2.10')}", //weblogic 12.1.3 bruker joda-time:1.2.1

        // commons-lang - vurderes i SKIF-271

]

// JAXWS
libraries.jaxws_api = "javax.xml.ws:jaxws-api:${JAXWS_VERSION}" //for kompilering
libraries.jaxws_rt = [ //for kjøring utenfor container
        libraries.jaxb_impl,
        "com.sun.xml.ws:jaxws-rt:${JAXWS_VERSION}",
]
libraries.jaxws_tools = [
        libraries.jaxws_rt,
        "com.sun.xml.bind:jaxb-jxc:${JAXB_VERSION}", // For å få den til å bruke minst samme versjon av JAXB som resten
        "com.sun.xml.ws:jaxws-tools:${JAXWS_VERSION}",
]
libraries.jaxb_xjc = [
        libraries.jaxb_impl,
        "com.sun.xml.bind:jaxb-impl:${JAXB_VERSION}",
        "com.sun.xml.bind:jaxb-xjc:${JAXB_VERSION}",
]

// SKIF-239: Mulighet for valg av ojdbc driver
libraries.jdbc = ORA_DEBUG ? libraries.ojdbc_g : libraries.ojdbc


libraries.hibernate_3_6_api = [
//        files("c:/dev/skif/hibernate-core-3.6.10.Final.bubbleref.v5.jar"),  // Brukes istedet for den under ifm lokal testing av ny versjon
        'org.hibernate:hibernate-core:3.6.10.Final.bubbleref.v7@jar',
]

//hibernate impl avhengigheter - se 'org.hibernate:hibernate-parent:3.6.10.Final'
libraries.hibernate_3_6 = [
        libraries.hibernate_3_6_api, // custom implementation av 'org.hibernate:hibernate-parent:3.6.10.Final'
        libraries.slf4j_api,
        'antlr:antlr:2.7.6@jar', // antlr:3.x har annen pakkestruktur (org.antlr.*) og kan derfor ikke brukes sammen med hibernate 3.6.10 (gir feil i Weblogic)
        'commons-collections:commons-collections:3.2.2@jar',
        'dom4j:dom4j:1.6.1@jar',
        'org.javassist:javassist:3.21.0-GA@jar', //POM: javassist is optional, but if defined it should be version 3.9.0
//      'cglib:cglib:2.2', //POM: cglib is optional, but if defined it should be version 2.2
        'org.hibernate.javax.persistence:hibernate-jpa-2.0-api:1.0.1.Final@jar',
        'org.hibernate:hibernate-commons-annotations:3.2.0.Final@jar', //avhenger av slf4j
]

// SKIF baserer seg på Java EE 6
// javax.javaee-api:6.0 virker ikke for testing fordi det er gjort noe rart med klassene
libraries.jee = [
        'javax.annotation:javax.annotation-api:1.2', // Egentlig 1.1, men jeg finner ingen nøytral jar-fil med den versjonen, og WebLogic 12.1.3 inneholder 1.2 (versjon 1.1)
        'javax.servlet:javax.servlet-api:3.0.1',
        'javax.transaction:jta:1.1',
        'javax.ejb:ejb-api:3.0', // Egentlig 3.1, men jeg finner ingen jar-fil med den versjonen. Endringene er kanskje bare i implementasjonen?
]

// Oracle Weblogic dependencies for deployment
libraries.weblogic = files(
        "${WEBLOGIC_HOME}/wlserver/server/lib/weblogic.jar",
)


allprojects {
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                substitute(module('commons-logging:commons-logging')).because('SKIF bruker SLF4J').with(module(libraries.jcl_to_slf4j))
            }
        }
    }
}
