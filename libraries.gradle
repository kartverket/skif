// Optional configuration of library versions to use.
// Simply add version properties to your gradle.property file to use this feature.
def libVersion(String name, String defaultValue) {
    project.findProperty('version.' + name) ?: defaultValue //development mode only
}

ext.SLF4J_VERSION = libVersion('slf4j', '1.7.25')
ext.JAXB_VERSION = libVersion('jaxb', '3.0.1')
ext.JAXWS_VERSION = libVersion('jaxws', '3.0.1')


// build a map of the dependency artifacts to use. Allows centralized definition of the versions of artifacts to
// use. In that respect it serves a role similar to <dependencyManagement> in Maven
ext.libraries = [

        // Database
        ojdbc: "com.oracle.database.jdbc:ojdbc8:${libVersion('oracle', '19.3.0.0')}@jar",
        ojdbc_g: "com.oracle.database.jdbc.debug:ojdbc8_g:${libVersion('oracle', '19.3.0.0')}@jar",
        c3p0: "com.mchange:c3p0:${libVersion('c3p0', '0.9.5.5')}",

        // Logging
        slf4j_api: "org.slf4j:slf4j-api:${SLF4J_VERSION}",
        jcl_to_slf4j: "org.slf4j:jcl-over-slf4j:${SLF4J_VERSION}",
        jul_to_slf4j: "org.slf4j:jul-to-slf4j:${SLF4J_VERSION}",
        log4j_to_slf4j: "org.slf4j:log4j-over-slf4j:${SLF4J_VERSION}",
        logback_classic: "ch.qos.logback:logback-classic:${libVersion('logback', '1.2.10')}",

        // Guice med extensions
        guice: "com.google.inject:guice:${libVersion('guice', '6.0.0')}",
        guice_throwingproviders: "com.google.inject.extensions:guice-throwingproviders:${libVersion('guice', '6.0.0')}",
        guice_assistedinject: "com.google.inject.extensions:guice-assistedinject:${libVersion('guice', '6.0.0')}",
        guice_grapher: "com.google.inject.extensions:guice-grapher:${libVersion('guice', '6.0.0')}",
        // guice-servlet depends on servlet-api som her er provided via weblogic og derfor ikke skal være med her
        guice_servlet: "com.google.inject.extensions:guice-servlet:${libVersion('guice', '6.0.0')}@jar",


        // Utility libraries
        guava: "com.google.guava:guava:32.0.0-jre",
        jsr305: "com.google.code.findbugs:jsr305:3.0.2",
        xstream: 'com.thoughtworks.xstream:xstream:1.4.8',
        commons_pool: 'org.apache.commons:commons-pool2:2.11.1',


        // Testing
        testng: dependencies.create('org.testng:testng:6.14.3') {
            exclude group:'junit' // vi benytter ikke JUnit i prosjektet [SKIF-385]
        },
        mockito: 'org.mockito:mockito-core:2.19.0', /* mockito 3.x for java 8 */
        dbunit: 'org.dbunit:dbunit:2.5.4',
        unitils: 'org.unitils:unitils-core:3.4.6',
        assertj: 'org.assertj:assertj-core:3.17.0',
        reflections: 'org.reflections:reflections:0.9.11',

        // JAXB
        jaxb_impl: "com.sun.xml.bind:jaxb-impl:3.0.2",

        jodatime: "joda-time:joda-time:${libVersion('jodatime', '2.10')}", //weblogic 12.1.3 bruker joda-time:1.2.1

        // commons-lang - vurderes i SKIF-271

]

// JAXB
libraries.jaxb_api = "jakarta.xml.bind:jakarta.xml.bind-api:${JAXB_VERSION}"

// JAXWS
libraries.jaxws_api = "jakarta.xml.ws:jakarta.xml.ws-api:${JAXWS_VERSION}" //for kompilering
libraries.jws_api = 'jakarta.jws:jakarta.jws-api:1.1.1'
//libraries.jws_api = 'javax.jws:javax.jws-api:1.1'
libraries.jaxws_rt = [ //for kjøring utenfor container
        libraries.jaxb_impl,
        "com.sun.xml.ws:jaxws-rt:3.0.2",
]

// SKIF-239: Mulighet for valg av ojdbc driver
libraries.jdbc = ORA_DEBUG ? libraries.ojdbc_g : libraries.ojdbc

libraries.bubbleref_spi = [
        'no.statkart.skif:skif-bubble-spi:1.0.0'
]

libraries.hibernate = [
        'no.statkart.skif:skif-hibernate-support:2.0.2',
        'org.hibernate:hibernate-core-jakarta:5.6.15.Final.bubbleref.1',
]

// SKIF baserer seg på Java EE 9++?
// javax.javaee-api:6.0 virker ikke for testing fordi det er gjort noe rart med klassene
libraries.jee = [
        'jakarta.annotation:jakarta.annotation-api:2.0.1',
        'jakarta.servlet:jakarta.servlet-api:5.0.0',
        'jakarta.transaction:jakarta.transaction-api:2.0.1',
        'jakarta.ejb:jakarta.ejb-api:4.0.1',
        'jakarta.interceptor:jakarta.interceptor-api:2.1.0',
]

// Oracle Weblogic dependencies for deployment
libraries.weblogic = files(
        "${WEBLOGIC_HOME}/wlserver/server/lib/weblogic.jar",
)


allprojects {
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                substitute(module('commons-logging:commons-logging')).because('SKIF bruker SLF4J').using(module(libraries.jcl_to_slf4j))
            }
        }
    }
}
