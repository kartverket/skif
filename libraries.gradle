// Trengs for å tvinge vekk moxy på Weblogic 12c
libraries.weblogic_databinding = files(
        weblogicVersion == WEBLOGIC_VERSIONS.WL_12_1_3 ? [
                "${WEBLOGIC_HOME}/wlserver/modules/databinding.override_1.2.0.0.jar",
        ] : [
                "${WEBLOGIC_HOME}/wlserver/modules/databinding.override.jar",
        ],
)

libraries.weblogic = files(
        libraries.weblogic_databinding,

        weblogicVersion == WEBLOGIC_VERSIONS.WL_12_1_3 ? [
                "${WEBLOGIC_HOME}/oracle_common/modules/javax.annotation_1.2.0.0_1-1.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/javax.servlet_2.2.0.0_3-0.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/javax.ejb_3.3.0.jar",
                "${WEBLOGIC_HOME}/wlserver/modules/javax.interceptor_1.3.jar",
                "${WEBLOGIC_HOME}/wlserver/modules/javax.transaction_2.2.0.0_1-1.jar",
        ] : [
                "${WEBLOGIC_HOME}/oracle_common/modules/javax.annotation.javax.annotation-api.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/javax.servlet.javax.servlet-api.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/javax.ejb.javax.ejb-api.jar",
                "${WEBLOGIC_HOME}/wlserver/modules/javax.interceptor.javax.interceptor-api.jar",
                "${WEBLOGIC_HOME}/wlserver/modules/javax.transaction.javax.transaction-api.jar",
        ],

        libraries.weblogic_jaxws_rt,
)

libraries.weblogic_tools = files(
        libraries.weblogic_databinding,
        "${WEBLOGIC_HOME}/wlserver/server/lib/weblogic.jar",
)


