                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.bind.jaxb-core_2.2.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.bind.jaxb-impl_2.2.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.ws.jaxws-rt_2.2.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.ws.policy_2.4.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.stream.buffer.streambuffer_1.5.3.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/org.jvnet.staxex.stax-ex_1.7.5.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/org.glassfish.gmbal.gmbal-api-only_3.1.0-b001.jar",
        ] : [
                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.bind.jaxb-core.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.bind.jaxb-impl.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.ws.jaxws-rt.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.ws.policy.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/com.sun.xml.stream.buffer.streambuffer.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/org.jvnet.staxex.stax-ex.jar",
                "${WEBLOGIC_HOME}/oracle_common/modules/org.glassfish.gmbal-api-only.jar",
