apply plugin: 'maven'

dependencies {
    compile project(':skif-store-common')
    compile project(':skif-service-server')


    // Sett hibernateVersion i gradle.properties
    // Scope er provided, ein må sjølv inkludere skif-store-server-hs32 eller skif-store-server-hs36 i sitt prosjekt
    if(hibernateVersion.equals("3.2")) {
      provided libraries.hibernate_3_2
    } else if(hibernateVersion.equals("3.6")) {
      provided libraries.hibernate_3_6
    }

    compile libraries.gt2

    provided libraries.weblogic

    testCompile libraries.testng
    testCompile project(':skif-config')
    testCompile project(':skif-testsupport-common')
}

task sourcesJar(type: Jar, dependsOn:classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
    onlyIf { gradle.taskGraph.hasTask(install) || gradle.taskGraph.hasTask(uploadArchives) } //only when published..
}

artifacts {
    archives sourcesJar
}