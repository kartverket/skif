plugins {
    id 'java-library'
    id 'maven-publish'
    id 'sktools.provided'
}

dependencies {
    api project(':skif-store-common')
    api project(':skif-service-server')
    api libraries.guava //pga Multimap
    api libraries.hibernate

    provided libraries.jee

    implementation libraries.jodatime
    implementation libraries.jdbc //provided
    implementation libraries.hibernate

    testImplementation project(':skif-config')
    testImplementation project(':skif-testsupport-common')
}

task sourcesJar(type: Jar, dependsOn:classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourcesJar

            pom.withXml {
                asNode().dependencies.dependency.findAll { 'joda-time' == it.artifactId.text() }.each { it.appendNode('optional', 'true') } //optional avhengighet for joda-time [SKIF-472]
                asNode().dependencies.dependency.findAll { 'com.oracle.jdbc' == it.groupId.text() }.each { it.appendNode('optional', 'true'); it.scope[0].value = 'provided'} //optional, provided avhengighet for jdbc drivere - kan brukes for singleVm [SKIF-472]
            }
        }
    }
}
