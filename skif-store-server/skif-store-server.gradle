plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    registerFeature('jodatimeSupport') {
        usingSourceSet(sourceSets.main)
    }

    registerFeature('oracleSupport') {
        usingSourceSet(sourceSets.main)
    }

    withSourcesJar()
}

configurations {
    // Vil ja JEE-greiene i test runtime
    testImplementation.extendsFrom compileOnlyApi
}

dependencies {
    api enforcedPlatform(project(':skif-store-platform'))

    api project(':skif-store-common')
    api project(':skif-service-server')
    api 'com.google.guava:guava' //pga Multimap
    api 'no.statkart.skif:skif-hibernate-support'
    api 'org.hibernate:hibernate-core'

    jodatimeSupportApi enforcedPlatform(project(':skif-store-platform'))
    jodatimeSupportApi 'joda-time:joda-time'

    oracleSupportApi enforcedPlatform(project(':skif-store-platform'))
    oracleSupportApi libraries.jdbc

    testImplementation project(':skif-config')
    testImplementation project(':skif-testsupport-common')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            suppressPomMetadataWarningsFor('jodatimeSupportApiElements')
            suppressPomMetadataWarningsFor('jodatimeSupportRuntimeElements')
            suppressPomMetadataWarningsFor('oracleSupportApiElements')
            suppressPomMetadataWarningsFor('oracleSupportRuntimeElements')
        }
    }
}
