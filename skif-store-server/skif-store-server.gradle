plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api project(':skif-store-common')
    api project(':skif-service-server')
    api libs.guava //pga Multimap
    api libs.bundles.hibernate

    compileOnlyApi libs.jakarta.persistence.api
    compileOnlyApi libs.jakarta.transaction.api
    compileOnly libs.bundles.jee

    implementation libs.jodatime
    implementation libs.bundles.hibernate
    implementation libs.ojdbc //provided
    runtimeOnly libs.jaxb.api
    runtimeOnly libs.jakarta.activation.api
    runtimeOnly libs.jakarta.persistence.api
    runtimeOnly libs.jakarta.transaction.api

    compileOnly libs.openejb.core

    testImplementation libs.bundles.jee
    testImplementation project(':skif-config')
    testImplementation project(':skif-testsupport-common')
    testImplementation libs.checker.framework // Trengs til mock av SessionImplementor i EntityComponentChangeTypeTest
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom.withXml {
                asNode().dependencies.dependency.findAll { 'joda-time' == it.artifactId.text() }.each { it.appendNode('optional', 'true') } //optional avhengighet for joda-time [SKIF-472]
                asNode().dependencies.dependency.findAll { 'com.oracle.database.jdbc' == it.groupId.text() }.each { it.appendNode('optional', 'true'); it.scope[0].value = 'provided'} //optional, provided avhengighet for jdbc drivere - kan brukes for singleVm [SKIF-472]
            }
        }
    }
}
