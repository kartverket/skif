['1.6'].with {
    if (!it.find { gradle.gradleVersion == it }) {
        logger.warn "WARNING: Du benytter et nyere gradle enn hva byggesystemet er testet med ${it}"
    }
    assert it.find { gradle.gradleVersion >= it } //eldre versjoner fungerer ikke - nye versjoner testes på eget ansvar
}


apply plugin: 'sktools-filterproperties-plugin'

//user properties
Map userProperties = propertyUtils.fromFile('gradle-user.properties') << gradle.startParameter.projectProperties
propertyUtils.assignPropertiesToProject(userProperties)

allprojects {
    apply plugin: 'sktools-filterproperties-plugin'
    propertyUtils.assignPropertiesToProject(userProperties)

    //version kan bestemmes via env variabel og -P parameter
    if (project.hasProperty('version')) {
        project.version = getProperty('version')
    }

    defaultTasks 'build'
    group = 'no.statkart.skif'


    plugins.withType(JavaBasePlugin.class) {
        sourceCompatibility = '1.6'
        targetCompatibility = '1.6'
    }


    apply plugin: 'idea'
    apply plugin: 'sktools-ideaextensions-plugin'


    repositories {
        if (MAVEN_LOCAL_FOR_PROJECT) {
            println '...initializing MAVEN_LOCAL_FOR_PROJECT'
            mavenLocal()
        }
        mavenRepo name: 'public', url: MAVEN_REPO

        if (!MAVEN_LOCAL_FOR_PROJECT) {
            mavenLocal()
        }
    }

}

apply from: file('libraries.gradle')

subprojects { Project project ->
    apply plugin: 'project-report'
    apply plugin: 'base' // Så vet vi at vi har clean

    clean {
        delete 'gen'
    }
    rootProject.ideaExtensions.ignorePaths += project.file('gen')

    propertyUtils.expandProjectProperties() //må ekspanderes i alle prosjekter da det kun er initielle build.properties + ifra kommandolinjen som blir arvet...
    //PS: dersom 'version' eller andre properties ønskes overstyrt i underprosjekter må disse evaluerest først. (evt kan man legge denne til en afterEvaluate{})

    // TODO: Denne skal egentlig kun brukes på skif-config mener Henrik. Rett opp dette når filtrering er fjernet fra andre moduler.
    apply plugin: 'sktools-filterproperties-plugin'
    project.filterProperties {
        Map filterProperties = propertyUtils.fromFile("${project.name}-filter.properties") << gradle.startParameter.projectProperties
        propertyUtils.expandProperties(filterProperties)
        properties filterProperties
    }

    def filterTestGroup = { Test test = test, String group, String value ->
        test.with {
            if (testFramework.class.simpleName == 'TestNGTestFramework') {
                if (value == 'INCLUDE') {
                    testFramework.options.includeGroups group
                    logger.info "${test.name} configuration: including group '${group}'"
                } else if (value == 'EXCLUDE') {
                    testFramework.options.excludeGroups group
                    logger.info "${test.name} configuration: excluding group '${group}'"
                } else if (value == 'EXCLUDE_WHEN_NO_INCLUDES') {
                    project.afterEvaluate {
                        if (testFramework.options.includeGroups.isEmpty()) {
                            testFramework.options.excludeGroups group
                            logger.info "${test.name} configuration: excluding group '${group}'"
                        } else {
//                        logger.info "${test.name} configuration: ignoring group '${group}'"
                        }
                    }
                } else {
                    assert value == 'IGNORED' //feil ved ikke gyldig verdi for filtrering av tester
                }
            } else {
                logger.warn "${test.name} configuration: unable to configure groups('${group}') for ${testFramework.class.simpleName}"
            }
        }
    }


    plugins.withType(JavaPlugin) {
        project.apply plugin: 'sktools-provided-plugin'

        // Avhengigheter som trengs for testing (riktignok ikke alle overalt)
        project.dependencies {
            testCompile(libraries.testng) {
                exclude group: 'junit'  // vi benytter ikke JUnit i prosjektet
            }
            testCompile libraries.mockito
            testCompile libraries.fest
        }


        /**
         * Testing via TestNG grupper. Se bruk av @Test(groups = "") i koden.
         * Følgende parametere styrer hvilke grupper som blir kjørt:
         *
         * gradle test -DfilterSlowTests=INCLUDE
         * gradle test -DfilterOracleLatest=INCLUDE
         * gradle test -PhibernateVersion=xx for hibernate versjon spesifike tester
         * osv..
         *
         * GBOK-2266: Tilpasset oppsett for downstream testing i Jenkins
         * Dersom ingen test-oppsett spesifisert så eksluderes alle grupper.
         * Dersom test-oppsett spesifiseres, kjøres kun spesifisert gruppe.
         *  - På denne måten oppnås disjointe sett av tester slik man unngår å kjøre samme test to ganger i de ulike Jenkins jobbene.
         *
         * En har videre mulighet til ytterligere å spesifisere kombinasjoner av grupper.
         * F.eks. vil gradle test -DfilterHistorikkTests=INCLUDE -DfilterSlowTests=EXCLUDE kjøre alle tester i gruppen historikk, men ikke de som også finnes i gruppen slow.
         * Har man en test annotert med @Test(groups = "kreverHistorikk, slow") vil den testen da ikke kjøres.
         *
         * -DignoreFailures=true stopper ikke eksekvering etter feilende modul og kjører videre. Kjekt for integrasjonstesting som ønsker å kjøre alle tester alltid.
         *
         * --info gir verbos logging av hvilke grupper som faktisk blir inkludert og ekskludert.
         */
        test {
            ignoreFailures = gradle.startParameter.systemPropertiesArgs.get('ignoreFailures', 'false') == 'true' //Gradle feiler ikke dersom denne er true.

            def filterSlowTests = gradle.startParameter.systemPropertiesArgs.get('filterSlowTests', 'EXCLUDE_WHEN_NO_INCLUDES').toUpperCase(); //gruppen kan kombineres med andre
            def filterOracleLatest = gradle.startParameter.systemPropertiesArgs.get('filterOracleLatest', 'EXCLUDE').toUpperCase();

            filterTestGroup(it, 'slow', filterSlowTests)
            filterTestGroup(it, 'oracleLatest', filterOracleLatest) // Midlertidig lagt til denne gruppe for å exclude tester som krever seneste oracle versjon

            filterTestGroup(it, 'hibernate36', hibernateVersion == '3.6' ? 'IGNORED' : 'EXCLUDE')
            filterTestGroup(it, 'hibernate32', hibernateVersion == '3.2' ? 'IGNORED' : 'EXCLUDE')


            jvmArgs '-Xmx1024m'
            testLogging.showStandardStreams = true

            inputs.property 'excludedGroups', testFramework.options.includeGroups //trigger re-kjøring av test ved endring av grupper
            inputs.property 'includedGroups', testFramework.options.excludeGroups //trigger re-kjøring av test ved endring av grupper
        }
    }

    project.tasks.withType(Test) { Test test ->  //felles for alle test-tasks
        def singleVm = Boolean.valueOf(rootProject.ext.properties['single_vm'])
        logger.debug "single_vm is set to ${singleVm} for ${project.path}"

        useTestNG() {  //benytter kun TestNG over alt
//            listeners << 'org.uncommons.reportng.HTMLReporter' // Gradles innebygde rapport viser ikke skipped
            listeners << 'org.testng.reporters.XMLReporter' // For Jenkins, siden Gradle 1.4+ ikke tar med default listeners som standard lenger
        }

        filterTestGroup(test, 'broken', 'EXCLUDE')
        filterTestGroup(test, 'singlevm-required', singleVm ? 'IGNORED' : 'EXCLUDE')
        filterTestGroup(test, 'server-required', singleVm ? 'EXCLUDE' : 'IGNORED')

        systemProperties "org.uncommons.reportng.stylesheet": "${project.rootProject.file('all/test/report/reportng-1.1.3/stylesheets/hudsonesque.css')}"
        systemProperties "org.uncommons.reportng.title": "${project.name} Report"


        inputs.property 'singleVm', singleVm //trigger re-kjøring av test ved endring av parameter

        if (rootProject.hasProperty('test.remote.debug')) {
            jvmArgs '-Xdebug'
            jvmArgs '-Xnoagent'
            jvmArgs '-Xrunjdwp:transport=dt_socket,address=8787,server=y,suspend=y'
        }

        //listening to test execution events
        afterTest { descriptor, result ->
            logger.lifecycle("${result.toString() == 'SUCCESS' ? ' Successfully tested' : 'Failed testing'} : ${descriptor.className}#${descriptor.name}")
            if (result.resultType.name() == 'FAILURE') {
                logger.error("${result.exception}")
            }
        }
    }


    afterEvaluate {
        //kobler inn standard upload repositores ved bruk av maven plugin
        if (plugins.hasPlugin('maven')) {
            uploadArchives.repositories.mavenDeployer {
                repository(url: uri(REPO_UPLOAD_RELEASES)) {
                    authentication([userName: REPO_UPLOAD_RELEASES_USERNAME, password: REPO_UPLOAD_RELEASES_PASSWORD])
                }
            }
        }
    }

    project.idea.module {
        // Får Idea til å legge build katalog for alle moduler i en egen felles topp katalog (out/production, out/test)
        inheritOutputDirs = true
    }

    tasks.ideaModule {

        // Plasserer weblogic avhengigheter til sist på classpath...
        doFirst {
            def weblogic_home = project.WEBLOGIC_HOME.replace('\\', '/').toLowerCase()

            project.idea.module.iml.withXml { provider ->
                def rootNode = provider.asNode()
                def node = rootNode.component.find { it.@name == 'NewModuleRootManager' }

                def weblogicNodes = node.orderEntry.findAll {
                    it.@type.equals('module-library') && it.library.CLASSES.root.@url.findAll({ it.toLowerCase().contains(weblogic_home) }).size() > 0
                }

                weblogicNodes.each { node.remove it }
                weblogicNodes.each { node.append it }
            }
        }

    }
}

afterEvaluate {

    idea.project {
        jdkName = '1.6'
        languageLevel = '1.6'

        ipr {
            //adding Perforce as default vcs by tinkering with the output *.ipr file before it's written out
            withXml {
                def node = it.asNode()
                def component = node.appendNode('component', ['name': 'VcsDirectoryMappings'])
                component.appendNode('mapping', ['directory': '', 'vcs': 'Perforce'])
            }
        }
    }

    // branch spesifike navn for prosjekt og workspace fil.
    ideaWorkspace {
        outputFile = file("${project.name}-${project.version.toString().replace('-SNAPSHOT', '')}-wl${weblogicVersion}.iws")
    }
    idea.project {
        outputFile = file("${project.name}-${project.version.toString().replace('-SNAPSHOT', '')}-wl${weblogicVersion}.ipr")
    }

    // gradle spesifik iml fil da gradle dependencies ligger på hver modul
    allprojects {
        idea.module {
            outputFile = file("${project.name}-wl${weblogicVersion}.iml")
        }
    }

}

//SKIF-266: versjon informasjon i distribusjon
allprojects {
    afterEvaluate {
        tasks.withType(Jar) {
            it.manifest {
                attributes([
                        'Specification-Title': project.name,
                        'Specification-Vendor': 'Statens kartverk',
                        'Specification-Version': gradle.startParameter.projectProperties.get('version', version),

                        //misc build info
                        'Build-By': System.getenv('USERNAME'),
                        'Build-Machine': System.getenv('COMPUTERNAME'),
                        'Build-Repo': MAVEN_REPO,

                        'Implementation-Title': "${project.name} bygget for ${version.contains('-SNAPSHOT') || version.contains('-build') ? 'TEST' : 'Produksjon'}",
                        'Implementation-Version': project.version,
                        'Implementation-Vendor': 'Statens kartverk',
                ])
            }
        }
    }
}


buildscript {

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    // Miljøvariable for konfigurasjon av byggemiljø
    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    [
            'JAVA_HOME',
            'COMPUTERNAME',
            'LOCALHOSTNAME',
            'WEBLOGIC_HOME',
            'WEBLOGIC_VERSION',
    ].each { key ->
        if (!project.hasProperty(key) && System.getenv(key) != null) {
            project.ext.setProperty(key, System.getenv(key))
        }
    }

    if (!project.hasProperty('LOCALHOSTNAME')) {
        project.ext.setProperty('LOCALHOSTNAME', '${COMPUTERNAME}.statkart.no')
    }

    ext.ORA_DEBUG = Boolean.valueOf("${rootProject.properties.get('ORA_DEBUG', System.getenv('ORA_DEBUG')) ?: 'false'}")

    ext.MAVEN_REPO = rootProject.properties.get('MAVEN_REPO', System.getenv('MAVEN_REPO'))
    if (ext.MAVEN_REPO == null) {
        ext.MAVEN_REPO = 'http://nexus.statkart.no:8090/nexus/content/groups/public/'
        logger.warn "warning: MAVEN_REPO not defined. Defaulting to ${MAVEN_REPO}"
    }

    ext.REPO_UPLOAD_RELEASES = rootProject.properties.get('REPO_UPLOAD_RELEASES', System.getenv('REPO_UPLOAD_RELEASES'))
    if (ext.REPO_UPLOAD_RELEASES == null) {
        ext.REPO_UPLOAD_RELEASES = 'http://admin:admin123@nexus.statkart.no:8090/nexus/content/repositories/releases/'
        logger.warn "warning: REPO_UPLOAD_RELEASES not defined. Defaulting to ${'http://admin:***@nexus.statkart.no:8090/nexus/content/repositories/releases/'}"
    }
    ext.REPO_UPLOAD_RELEASES_USERNAME = rootProject.properties.get('REPO_UPLOAD_RELEASES_USERNAME', System.getenv('REPO_UPLOAD_RELEASES_USERNAME'))
    if (ext.REPO_UPLOAD_RELEASES_USERNAME == null) {
        ext.REPO_UPLOAD_RELEASES_USERNAME = 'admin'
        logger.warn "warning: REPO_UPLOAD_RELEASES_USERNAME not defined. Defaulting to admin"
    }
    ext.REPO_UPLOAD_RELEASES_PASSWORD = rootProject.properties.get('REPO_UPLOAD_RELEASES_PASSWORD', System.getenv('REPO_UPLOAD_RELEASES_PASSWORD'))
    if (ext.REPO_UPLOAD_RELEASES_PASSWORD == null) {
        ext.REPO_UPLOAD_RELEASES_PASSWORD = 'admin123'
        logger.warn "warning: REPO_UPLOAD_RELEASES_PASSWORD not defined. Defaulting to default admin password"
    }

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    // Switch for tentativ utvikling mot lokalt maven repository
    // Se http://forums.gradle.org/gradle/topics/dependency_resolution_in_gradle_1_0_milestone_8 for teknisk beskrivelse.
    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    project.ext.set('MAVEN_LOCAL_FOR_BUILDSYSTEM', (Boolean.parseBoolean(System.getenv('MAVEN_LOCAL')) || Boolean.parseBoolean(System.getenv('MAVEN_LOCAL_FOR_BUILDSYSTEM'))) ? true : null)
    project.ext.set('MAVEN_LOCAL_FOR_PROJECT', (Boolean.parseBoolean(System.getenv('MAVEN_LOCAL')) || Boolean.parseBoolean(System.getenv('MAVEN_LOCAL_FOR_PROJECT'))) ? true : null)


    repositories {
        if (MAVEN_LOCAL_FOR_BUILDSYSTEM) {
            println '...initializing MAVEN_LOCAL_FOR_BUILDSYSTEM'
            mavenLocal()
        }
        mavenRepo name: 'public', url: MAVEN_REPO

        if (!MAVEN_LOCAL_FOR_BUILDSYSTEM) {
            mavenLocal()
        }
    }

    dependencies {
        classpath 'no.statkart.sktools.gradle:gradle-plugins:trunk-build232'
    }
}
