import no.statkart.gradle.util.PropertyUtil
import no.statkart.gradle.util.GradleUtil

apply plugin: 'idea'
apply plugin: 'statkart-idea-extensions-plugin'

assert gradle.gradleVersion == '1.0-milestone-7'

userProperties = PropertyUtil.loadUserPropertiesOrEmpty(project)

// version kan settes via properties (feks kommandolinje -P )
if (project.hasProperty('version')) { version = getProperty('version') }

// standard kode-versjon for branch
if (version == 'unspecified') { version = '2.1111-SNAPSHOT' }

buildscript {
    // Variables to grab from environment
    ['WEBLOGIC_HOME', 'COMPUTERNAME', 'PUBLIC_REPO'].each { val ->
        if (!project.hasProperty(val) && System.getenv(val) != null) {
            project.setProperty(val, System.getenv(val))
        }
    }
    publicRepo = rootProject.properties.get('PUBLIC_REPO', 'http://skrivap92.statkart.no:8001/nexus/content/groups/public/')
    repositories {
        mavenLocal()
        mavenRepo name: 'public', urls: publicRepo
    }
    dependencies {
        classpath 'no.statkart:statkart-gradle-plugins:23'
        classpath 'no.statkart.sktools.gradle:dbtools-plugin:1.0'
    }
}

allprojects {
    defaultTasks 'build'
    version = rootProject.version
    group = 'no.statkart.skif'

    PropertyUtil.expandProjectProperties(project, userProperties)

    plugins.whenPluginAdded() {
        if (it instanceof org.gradle.api.plugins.MavenPlugin) {
            uploadArchives.repositories.mavenDeployer {
                if (!version.contains("SNAPSHOT")) {
                    repository(url: uri(properties.get('REPO_UPLOAD_RELEASES', 'http://skrivap92.statkart.no:8001/nexus/content/repositories/releases/'))) {
                        authentication(userName: "admin", password: "admin123")
                    }
                } else {
                    repository(url: uri(properties.get('REPO_UPLOAD_SNAPSHOTS', 'http://skrivap92.statkart.no:8001/nexus/content/repositories/snapshots/'))) {
                        authentication(userName: "admin", password: "admin123")
                    }
                }
            }
        }
    }
}

// library versions to use. will be initialized from version.* in project.properties
versions = properties.findAll { it.key.startsWith('version.') }.collectEntries { key, value -> [key.replace('version.', ''), value] }

// build a map of the dependency artifacts to use. Allows centralized definition of the versions of artifacts to
// use. In that respect it serves a role similar to <dependencyManagement> in Maven
libraries = [

        // Database
        ojdbc: "com.oracle:ojdbc6:${versions.oracle}@jar",

        // Logging 
        slf4j_api: "org.slf4j:slf4j-api:${versions.slf4j}@jar",
        jcl_to_slf4j: "org.slf4j:jcl-over-slf4j:${versions.slf4j}@jar",
        jul_to_slf4j: "org.slf4j:jul-to-slf4j:${versions.slf4j}@jar",
        log4j_to_slf4j: "org.slf4j:log4j-over-slf4j:${versions.slf4j}@jar",
        logback_classic: "ch.qos.logback:logback-classic:${versions.logback}@jar",
        logback_core: "ch.qos.logback:logback-core:${versions.logback}@jar",

        // Guice med extensions
        guice: "com.google.inject:guice:${versions.guice}",
        guice_multibindings: "com.google.inject.extensions:guice-multibindings:${versions.guice}",
        guice_throwingproviders: "com.google.inject.extensions:guice-throwingproviders:${versions.guice}",
        guice_assistedinject: "com.google.inject.extensions:guice-assistedinject:${versions.guice}",
        guice_grapher: "com.google.inject.extensions:guice-grapher:${versions.guice}",
        // guice-servlet depends on servlet-api som her er provided via weblogic og derfor ikke skal være med her
        guice_servlet: "com.google.inject.extensions:guice-servlet:${versions.guice}@jar",

        jsr330: "javax.inject:javax.inject:1",

        // Utility libraries
        guava: "com.google.guava:guava:r09",
        jsr305: "com.google.code.findbugs:jsr305:1.3.9",

        // Testing
        testng: 'org.testng:testng:6.0.1',
        mockito: 'org.mockito:mockito-all:1.8.5',
        dbunit: 'org.dbunit:dbunit:2.4.8@jar',
        unitils: 'org.unitils:unitils-core:3.1',
        fest: 'org.easytesting:fest-assert:1.4',

        // JAXB
        jaxb_impl: "com.sun.xml.bind:jaxb-impl:${versions.jaxb}",
        jaxb_xjc: "com.sun.xml.bind:jaxb-xjc:${versions.jaxb}",

        // Build system
        build_utils: "no.statkart.grunnbok:build-utils:${versions.buildUtils}",

        jts: "com.vividsolutions:jts:${versions.jts}",

]

// JAX-WS runtime for weblogic
libraries.jaxws_rt = files(
        files(isWeblogic10310() ? "${WEBLOGIC_HOME}/modules/glassfish.jaxws.rt_1.0.0.0_2-1-4.jar" :
            "${WEBLOGIC_HOME}/modules/glassfish.jaxws.rt_1.2.0.0_2-1-5.jar"),
)

boolean isWeblogic10310() {
    new File("${WEBLOGIC_HOME}/utils/config/10.3.1.0/".toString()).exists()
}

// Weblogic jar files must be located in the WEBLOGIC_HOME directory since they internally (in their manifest file) refer to other files in the directory
libraries.weblogic = files(
        "${WEBLOGIC_HOME}/wlserver_10.3/server/lib/weblogic.jar",
        "${WEBLOGIC_HOME}/wlserver_10.3/server/lib/webservices.jar",
        "${WEBLOGIC_HOME}/wlserver_10.3/server/lib/wljmsclient.jar",
        isWeblogic10310() ? "${WEBLOGIC_HOME}/modules/javax.annotation_1.1.jar/" :
            "${WEBLOGIC_HOME}/modules/javax.annotation_1.0.0.0_1-0.jar/",
        "${WEBLOGIC_HOME}/modules/javax.ejb_3.0.1.jar",
        "${WEBLOGIC_HOME}/modules/javax.interceptor_1.0.jar",
        "${WEBLOGIC_HOME}/modules/javax.servlet_1.0.0.0_2-5.jar",
        "${WEBLOGIC_HOME}/modules/javax.transaction_1.0.0.0_1-1.jar",
        isWeblogic10310() ? "${WEBLOGIC_HOME}/modules/com.bea.core.transaction_2.5.1.0.jar" :
            "${WEBLOGIC_HOME}/modules/com.bea.core.transaction_2.7.0.0.jar",
        isWeblogic10310() ? "${WEBLOGIC_HOME}/modules/com.bea.core.datasource6_1.6.0.0.jar" :
            "${WEBLOGIC_HOME}/modules/com.bea.core.datasource6_1.9.0.0.jar",
        libraries.jaxws_rt,
)
libraries.gt2 = [
        'org.geotools:gt2-oracle-spatial:2.2.2-CUSTOM@jar',
]

libraries.guice_with_used_deps = [
        libraries.guice,
        libraries.guice_multibindings,
        libraries.guice_throwingproviders,
        libraries.guice_assistedinject,
        libraries.guice_servlet,
        libraries.jsr330,
]

libraries.hibernate_3_2 = [
        'antlr:antlr:2.7.6@jar',
        'cglib:cglib-nodep:2.2@jar',
        'dom4j:dom4j:1.4@jar',
        'net.sf.ehcache:ehcache:1.2.3@jar',
        'odmg:odmg:3.0@jar',
        "org.hibernate:hibernate:${versions.hibernate}-bubbleref-v2@jar",
        libraries.ojdbc,
]

libraries.hibernate_tools_3_2 = [
        "org.hibernate:hibernate-tools:${versions.hibernate}@jar",
]

libraries.hibernate_3_6 = [
        'org.hibernate:hibernate-parent:3.6.4.Final',
        'org.hibernate:hibernate-core:3.6.4.Final',
        'javassist:javassist:3.12.0.GA',
        libraries.ojdbc,
]


subprojects { Project project ->
    apply plugin: 'idea'
    apply plugin: 'project-report'
    apply plugin: 'base'

    sourceCompatibility = '1.6'
    targetCompatibility = '1.6'

    configurations {
        weblogic {
            description = 'Weblogic dependencies'
        }

        provided {
            description = 'Provided dependencies not to be included in dependencies'
        }
    }

    repositories {
        mavenLocal()
        mavenRepo name: 'public', urls: publicRepo
    }

    dependencies {
        weblogic libraries.weblogic
    }

    if (!project.name.endsWith('-ear')) {
        apply plugin: 'java'
        apply plugin: 'statkart-filter-properties-plugin'

        statKartFilterProperties {
            properties = project.properties.findAll { it.value instanceof String }
            resources = [main: 'src/main/resources.filtered', test: 'src/test/resources.filtered']
        }

        // appropriately inject the common dependencies into each sub-project
        dependencies {
            compile libraries.slf4j_api
            compile libraries.jsr305

            testCompile libraries.testng
            testCompile libraries.mockito
            testCompile libraries.fest
            testRuntime 'org.uncommons:reportng:1.1.3'
            testRuntime 'velocity:velocity-dep:1.4'
        }

        sourceSets {
            main.compileClasspath += configurations.provided
            test.compileClasspath += configurations.provided
            test.runtimeClasspath += configurations.provided
        }

        project.idea.module {
            // Får Idea til å legge build katalog for alle moduler i en egen felles topp katalog (out/production, out/test)
            inheritOutputDirs = true
            scopes.PROVIDED.plus += configurations.provided
        }

        test {
            boolean singleVm = Boolean.valueOf(rootProject.properties['single_vm'])
            useTestNG() {
                excludeGroups('broken')
                if (singleVm) {
                    excludeGroups('server-required')
                } else {
                    excludeGroups('singlevm-required')
                }
            }
            systemProperties "org.uncommons.reportng.stylesheet": "${project.rootProject.file('all/test/report/reportng-1.1.3/stylesheets/hudsonesque.css')}"
            systemProperties "org.uncommons.reportng.title": "${project.name} Report"

            options {
                listeners << 'org.uncommons.reportng.HTMLReporter'
                listeners << 'org.uncommons.reportng.JUnitXMLReporter'
            }
            jvmArgs '-Xmx1024m'
            if (rootProject.hasProperty('test.remote.debug')) {
                jvmArgs '-Xdebug'
                jvmArgs '-Xnoagent'
                jvmArgs '-Xrunjdwp:transport=dt_socket,address=8787,server=y,suspend=y'
            }
        }

        //Source is in the build directory so we need to unexclude it
        GradleUtil.makeIdeaShowBuildDirectory(project)
    }
}

idea.project {
    jdkName = '1.6'
    languageLevel = '1.6'

    ipr {
        //adding Perforce as default vcs by tinkering with the output *.ipr file before it's written out
        withXml {
            def node = it.asNode()
            def component = node.appendNode('component', ['name': 'VcsDirectoryMappings'])
            component.appendNode('mapping', ['directory': '', 'vcs': 'Perforce'])
        }
    }
}

