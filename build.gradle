def boolean isJavaProject(Project project) {
    return project.subprojects.size() == 0 && !project.name.endsWith('-ear')
}

subprojects { Project project ->
    apply plugin: 'idea'
    apply plugin: 'project-report'
    apply plugin: 'base'

    configurations {
        provided {
            description = 'Provided dependencies not to be included in dependencies'
        }
    }

    if (isJavaProject(project)) {
        apply plugin: 'java'

        sourceCompatibility = '1.6'
        targetCompatibility = '1.6'

        //filter properties
        def filterProperties = loadJavaProps()


        // appropriately inject the common dependencies into each sub-project
        dependencies {
            compile libraries.slf4j_api
            compile libraries.jsr305

            testCompile libraries.testng
            testCompile libraries.mockito
            testRuntime 'org.uncommons:reportng:1.1.3'
            testRuntime 'velocity:velocity-dep:1.4'
        }

        sourceSets {
            main.compileClasspath += configurations.provided
            test.compileClasspath += configurations.provided
            test.runtimeClasspath += configurations.provided
        }


        ['main', 'test'].each { String scope ->
            def unfilteredPropertiesDir = project.file("src/${scope}/resources.filtered")
            if (unfilteredPropertiesDir.isDirectory()) {
                def filteredResourcesDir = project.file("build/generated/${scope}/resources")
                task "filterResources$scope" {
                   inputs.dir(unfilteredPropertiesDir)
                   inputs.properties(filterProperties)
                   outputs.dir(filteredResourcesDir)
                    doLast {
                        delete(filteredResourcesDir);
                        copy {
                            from(unfilteredPropertiesDir)
                            into(filteredResourcesDir)
                            filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: filterProperties)
                        }
                        ant.touch() { fileset(dir: filteredResourcesDir)}
                    }
                }
                project.sourceSets."$scope".resources.srcDir filteredResourcesDir
                project.processResources.dependsOn "filterResources$scope"


		//Source is in the build directory so we need to unexclude it
		idea.module {
		    iml {
			whenMerged {
			    it.excludeFolders = it.excludeFolders.findAll {println it; !it.url.contains("build")}
			}
		    }
		}
            }
            
        }

        test {
            boolean singleVm = Boolean.valueOf(rootProject.properties['single_vm'])
            println "single_vm is set to ${singleVm} for ${project.path}"
            useTestNG() {
                excludeGroups('broken')
                if (singleVm) {
                    excludeGroups('server-required')
                } else {
                    excludeGroups('singlevm-required')
                }
            }
            systemProperties "org.uncommons.reportng.stylesheet": "${project.rootProject.file('all/test/report/reportng-1.1.3/stylesheets/hudsonesque.css')}"
            systemProperties "org.uncommons.reportng.title": "${project.name} Report"

            options {
                listeners << 'org.uncommons.reportng.HTMLReporter'
                listeners << 'org.uncommons.reportng.JUnitXMLReporter'
            }
            jvmArgs '-Xmx1024m'
            //useDefaultListeners = false
        }


        idea.module {
            // Får Idea til å legge build katalog for alle moduler i et eget felles topp katalog (out/production, out/test)
            inheritOutputDirs = true
            scopes.PROVIDED.plus += configurations.provided

            iml {
                beforeMerged { module ->
                    module.sourceFolders = [] as Set
                }
            }
        }
    }
}

/**
 * Project evaluation ordering must be defined in a separate step after plugins and other generic injection has been performed
 * on each subproject. Otherwise these injections done by this build file will not have been performed before the build file
 * of the subproject is evaluated.
 */
subprojects { Project project ->
    setEvaluationOrder(project)
}

