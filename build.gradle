// See http://issues.gradle.org/browse/GRADLE-1419
Map loadJavaProps(List files, boolean strict) {
    Map map = new HashMap();
    Properties props = new Properties();
    files.each { file ->
        if (file.canRead()) {
            file.withInputStream { props.load(it) }
            logger.debug('Loaded ' + props.size() + ' from ' + file)
        } else {
            logger.debug("No props read from ${file} as file not accessible")
        }
    }
    ['wls.hostname': "${COMPUTERNAME}.statkart.no"].each {
        if (props.get(it.key) == null)
            props.put(it.key, it.value)
    }
    String newVal;
    boolean haveNewVal;
    int prevCount = props.size();
    def unresolveds = []
    while (prevCount > 0) {
        unresolveds.clear()
        new HashMap(props).each() { pk, pv ->
            haveNewVal = true;
            newVal = pv.replaceAll(/\$\{([^}]+)\}/, {
                if (project.hasProperty(it[1])) return project.property(it[1])
                if (map.get(it[1]) != null) return map.get(it[1])
                if (System.properties.containsKey(it[1]))
                    return System.properties[it[1]]
                unresolveds << it[1]
                haveNewVal = false;
                return it[0]
            })
            if (haveNewVal) {
                map.put(pk, newVal)
                props.remove(pk)
            }
        }
        if (prevCount == props.size()) {
            if (strict)
                throw new GradleException(
                        'Unable to resolve top-level properties: ' + props.keySet()
                                + '\ndue to unresolved references to: ' + unresolveds)
            logger.error(
                    'Unable to resolve top-level properties: ' + props.keySet()
                            + '\ndue to unresolved references to: ' + unresolveds)
            break
        }
        prevCount = props.size()
    }
    map
}

void expandProjectProperties(Project project, boolean strict) {

    logger.info "expanding properties for ${project.name}"

    Properties props = new Properties();
    project.properties.each {
        if (it.value instanceof CharSequence && it.value.matches(/.*\$\{([^}]+)\}.*/)) props.setProperty(it.key, it.value)
    }

    def newVal
    boolean haveNewVal
    int substitutionCount = -1
    def unresolveds = []
    while (substitutionCount != 0) {
        substitutionCount = 0
        unresolveds.clear()
        new HashMap(props).each() { pk, pv ->
            haveNewVal = true
            newVal = pv.replaceAll(/\$\{([^}]+)\}/, {
                if (project.hasProperty(it[1])) {
                    substitutionCount += 1
                    return project.property(it[1])
                }
                if (System.properties.containsKey(it[1])) {
                    substitutionCount += 1
                    return System.properties[it[1]]
                }
                unresolveds << it[1]
                haveNewVal = false
                return it[0]
            })
            if (haveNewVal) {
                props.setProperty(pk, newVal)
                project.setProperty(pk, newVal) //oppdateres alltid, også delvis substitusjon

                if (!newVal.matches(/.*\$\{([^}]+)\}.*/)) {
                    props.remove(pk)
                    logger.info "  resolved ${pk} = ${newVal}"
                }
            }
        }
        if (substitutionCount == 0) {
            if (!props.isEmpty()) {
                if (strict)
                    throw new GradleException(
                            'Unable to resolve top-level properties: ' + props.keySet()
                                    + '\ndue to unresolved references to: ' + unresolveds)
                logger.error(
                        'Unable to resolve top-level properties: ' + props.keySet()
                                + '\ndue to unresolved references to: ' + unresolveds)
            }
            break
        }
    }
}

