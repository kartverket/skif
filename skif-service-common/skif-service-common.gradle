apply plugin: 'maven'

configurations {
    testApi
}

dependencies {
    compile libraries.guice_with_used_deps
    provided libraries.jaxws_rt
}

task testJar(type: Jar) {
    classifier = 'tests'
    from sourceSets.test.classes
}


task javadocJar(type: Jar, dependsOn:javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
    onlyIf { gradle.taskGraph.hasTask(install) || gradle.taskGraph.hasTask(uploadArchives) } //only when published..
}

task sourcesJar(type: Jar, dependsOn:classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
    onlyIf { gradle.taskGraph.hasTask(install) || gradle.taskGraph.hasTask(uploadArchives) } //only when published..
}

artifacts {
    testApi testJar
    archives sourcesJar
    archives javadocJar
}

