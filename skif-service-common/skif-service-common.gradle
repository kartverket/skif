plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Inneholder service-rammeverk klasser for klient'

configurations {
    testApi
}

dependencies {
    api libraries.slf4j_api
    api libraries.jsr305
    api libraries.guice
    api libraries.guava //pga TypeToken

    implementation libraries.guava
    implementation libraries.jodatime
    implementation libraries.commons_pool
    compileOnly libraries.jaxws_api
    compileOnly libraries.jws_api

    testImplementation libraries.jaxws_rt
    testImplementation libraries.reflections
    testImplementation libraries.logback_classic
}

task testJar(type: Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

artifacts {
    testApi testJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom.withXml {
                asNode().dependencies.dependency.findAll { 'joda-time' == it.artifactId.text() }.each { it.appendNode('optional', 'true') } //optional avhengighet for joda-time [SKIF-472]
            }
        }
    }
}

task assertDependencies() {
    doFirst {
        configurations.runtimeElements.copyRecursive{it instanceof ExternalDependency}.dependencies.each { Dependency dependency ->
            boolean godkjent = [
                    'joda-time',
                    'org.slf4j',
                    'com.google.code.findbugs:jsr305',
                    'com.google.inject:guice',
                    'com.google.guava:guava',
                    'com.google.inject.extensions:guice-',
                    'org.apache.commons:commons-pool2'
            ].find { "${dependency.group}:${dependency.name}:${dependency.version}".startsWith(it) }

            if (!godkjent) {
                throw new TaskExecutionException(it, new RuntimeException('Ukjent avhengighet: ' + dependency)) //avhengighet ikke i godkjent-liste
            }
        }
    }
}
test.dependsOn assertDependencies //kjøres som en test

