apply plugin: 'java'
apply plugin: 'maven'

configurations {
    testApi
}

dependencies {
    compile libraries.slf4j_api
    compile libraries.jsr305
    compile libraries.guice_for_client
    compile libraries.guava
    compile libraries.jodatime
    provided libraries.jaxws_rt

    testCompile libraries.reflections
}

task testJar(type: Jar) {
    classifier = 'tests'
    from sourceSets.test.output
}

task sourcesJar(type: Jar, dependsOn:classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
    onlyIf { gradle.taskGraph.hasTask(install) || gradle.taskGraph.hasTask(uploadArchives) } //only when published..
}

artifacts {
    testApi testJar
    archives sourcesJar
}

task assertDependencies() {
    doFirst {
        configurations.runtime.copyRecursive{it instanceof ExternalDependency}.dependencies.each { Dependency dependency ->
            boolean godkjent = [
                    'joda-time',
                    'org.slf4j',
                    'com.google.code.findbugs:jsr305',
                    'com.google.inject:guice',
                    'com.google.guava:guava',
                    'com.google.inject.extensions:guice-',
            ].find { "${dependency.group}:${dependency.name}:${dependency.version}".startsWith(it) }

            if (!godkjent) {
                throw new TaskExecutionException(it, new RuntimeException('Ukjent avhengighet: ' + dependency)); //avhengighet ikke i godkjent-liste
            }
        }
    }
}
test.dependsOn assertDependencies //kjøres som en test


def installer = install.repositories.mavenInstaller
def deployer = uploadArchives.repositories.findByName('mavenDeployer')

[installer, deployer]*.pom*.whenConfigured { pom ->
    pom.dependencies.findAll { dep -> dep.groupId == 'joda-time' }.each { it.optional = true }  //optional avhengighet for joda-time [SKIF-472]
}