apply plugin: 'java-library'
apply plugin: 'maven-publish'

description = 'Inneholder service-rammeverk klasser for klient'

configurations {
    testApi
}

dependencies {
    api libraries.slf4j_api
    api libraries.jsr305
    api libraries.guice
    api libraries.guava //pga TypeToken

    implementation libraries.guice_multibindings
    implementation libraries.guava
    implementation libraries.jodatime
    compileOnly libraries.jaxws_api

    testImplementation libraries.weblogic_jaxws_rt
    testImplementation libraries.reflections
}

task testJar(type: Jar) {
    classifier = 'tests'
    from sourceSets.test.output
}

task sourcesJar(type: Jar, dependsOn:classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

artifacts {
    testApi testJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourcesJar

            pom.withXml {
                asNode().dependencies.dependency.findAll {
                    it.artifactId.text() == 'joda-time' //optional avhengighet for joda-time [SKIF-472]
                }.each {
                    it.appendNode('optional', 'true')
                }
            }
        }
    }
}

task assertDependencies() {
    doFirst {
        configurations.runtime.copyRecursive{it instanceof ExternalDependency}.dependencies.each { Dependency dependency ->
            boolean godkjent = [
                    'joda-time',
                    'org.slf4j',
                    'com.google.code.findbugs:jsr305',
                    'com.google.inject:guice',
                    'com.google.guava:guava',
                    'com.google.inject.extensions:guice-',
            ].find { "${dependency.group}:${dependency.name}:${dependency.version}".startsWith(it) }

            if (!godkjent) {
                throw new TaskExecutionException(it, new RuntimeException('Ukjent avhengighet: ' + dependency)); //avhengighet ikke i godkjent-liste
            }
        }
    }
}
test.dependsOn assertDependencies //kjøres som en test

