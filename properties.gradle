if (!project.hasProperty('MAVEN_REPO')) {
    logger.info 'warning: MAVEN_REPO not defined. Defaulting to ' + defaultProperties.MAVEN_REPO
}

defaultProperties.each { key, value ->
    if (!project.hasProperty(key)) {
        project.ext.set(key, value)
    }
}

task showProperties {
    doLast {
        println 'version: ' + project.version
        println '---'
        defaultProperties.each { key, value ->
            println key + ': ' + project.getProperty(key)
        }
    }
}
