apply plugin: 'sktools-wsgen-plugin'

configurations {
    war { description = 'War-artifaktet' }
    wsdls { description = 'Zip med WSDL-er' }
}

dependencies {
    compile project(':skif-wsversioning:skif-wsversioning-v1-ws:skif-wsversioning-v1-wscompat')
    compile project(':skif-wsversioning:skif-wsversioning-v1-ws:skif-wsversioning-v1-wsschema')
    compile project(':skif-wsversioning:skif-wsversioning-v1-ws:skif-wsversioning-v1-wsmapping')

    provided libraries.weblogic

    jaxws libraries['tools.jar']
    jaxws libraries.weblogic_tools
}

war {
    // Skinny war
    classpath = sourceSets.main.output
}

task zipWsdls(type: Zip) {
    classifier = 'wsdls'
    extension = 'war'
    from genWsdls
}

artifacts {
    wsdls zipWsdls
    war project.war
}
