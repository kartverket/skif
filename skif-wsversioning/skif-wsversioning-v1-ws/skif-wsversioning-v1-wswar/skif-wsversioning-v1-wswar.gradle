plugins {
    id 'sktools.wsgen'
    id 'sktools.provided'
}

configurations {
    war { description = 'War-artifaktet' }
    wsdls { description = 'Zip med WSDL-er' }
    earlib { extendsFrom implementation; description = 'Felles avhengheter i ear (skinny wars)'}
}

dependencies {
    implementation project(':skif-wsversioning:skif-wsversioning-v1-ws:skif-wsversioning-v1-wscompat')
    implementation project(':skif-wsversioning:skif-wsversioning-v1-ws:skif-wsversioning-v1-wsschema')
    implementation project(':skif-wsversioning:skif-wsversioning-v1-ws:skif-wsversioning-v1-wsmapping')

    provided project(':skif-wsversioning:skif-wsversioning-server')
    provided libraries.jee
    provided libraries.jaxws_rt

    jaxws "com.sun.xml.ws:jaxws-tools:$JAXWS_VERSION"
}

war {
    // Skinny war
    classpath = sourceSets.main.output
}

task zipWsdls(type: Zip) {
    archiveAppendix = 'wsdls'
    from genWsdls
}

artifacts {
    wsdls zipWsdls
    war project.war
}
