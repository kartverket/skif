plugins {
    id 'java-library'
    id 'sktools.provided'
}

dependencies {
    api project(':skif-wsversioning:skif-wsversioning-api')
    provided project(':skif-wsversioning:skif-wsversioning-v1-ws:skif-wsversioning-v1-wsschema')
    // Trengs for Java 11 får å unngå 'warning: unknown enum constant XmlAccessType.FIELD'
    api libs.jaxb.api

    testImplementation project(':skif-testsupport-common')

    //internal dependencies + optional deps to logging frameworks:
    testImplementation project(':skif-config')

}
