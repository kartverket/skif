plugins {
  id 'java'
  id 'sktools.xjc'
}

dependencies {
  implementation libraries.jaxws_api
  implementation libraries.jaxb_api

  compileOnly "org.glassfish.jaxb:jaxb-runtime:$JAXB_VERSION"
  jaxb "org.glassfish.jaxb:jaxb-xjc:$JAXB_VERSION"
}

sourceSets {
  main {
    xjc {
      schema {
        srcDir 'src/main/schema'
      }
    }
    resources.srcDirs = []
  }
}
