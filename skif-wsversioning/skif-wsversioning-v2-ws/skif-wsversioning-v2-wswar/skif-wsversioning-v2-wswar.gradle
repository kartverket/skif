plugins {
    id 'sktools.wsgen'
    id 'singlevm-variant'
    id 'skinny-war'
}

configurations {
    wsdls { description = 'Zip med WSDL-er'; canBeConsumed = true; canBeResolved = false }
}

dependencies {
    implementation project(':skif-wsversioning:skif-wsversioning-server')
    implementation project(':skif-wsversioning:skif-wsversioning-v2-ws:skif-wsversioning-v2-wsschema')
    implementation project(':skif-wsversioning:skif-wsversioning-v2-ws:skif-wsversioning-v2-wsmapping')

    provided libraries.jee
    provided libraries.jaxws_rt
}

task zipWsdls(type: Zip) {
    archiveClassifier = 'wsdls'
    from genWsdls
}

artifacts {
    wsdls zipWsdls
}
