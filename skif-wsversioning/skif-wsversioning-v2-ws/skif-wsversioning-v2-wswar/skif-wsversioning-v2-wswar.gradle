apply plugin: 'java'
apply plugin: 'sktools-weblogic-wswar-plugin'

sourceSets.weblogic {
  java.srcDirs = ['src/main/java']
  resources.srcDirs = []
}


warWeblogic {
  from 'src/main/webapp'
}

configurations {
    weblogicProvided.extendsFrom provided

    weblogicTools {
        description = 'Avhengigheter for weblogic-verktøy'
    }
}

dependencies {
    compile project(':skif-wsversioning:skif-wsversioning-server')
    compile project(':skif-wsversioning:skif-wsversioning-v2-ws:skif-wsversioning-v2-wsschema')
    compile project(':skif-wsversioning:skif-wsversioning-v2-ws:skif-wsversioning-v2-wsmapping')

    provided libraries.weblogic

    weblogicTools libraries['tools.jar']
    weblogicTools libraries.weblogic_tools
}

genWeblogic {
    classpath = sourceSets.weblogic.runtimeClasspath + configurations.weblogicTools
    weblogicClasspath = configurations.weblogicTools
}
