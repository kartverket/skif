apply plugin: 'sktools-dbtools-plugin'



// properties for substituering
def filterProperties  = [
        db_username: db_username,
        db_schema: db_username,
]

configureDatabasePlugin {
    useDrivers libraries.ojdbc

    project.ext.tns = "${db_sid}_${db_hostname}"

    toolset(name: '', type: 'oracle', prefix: '') {
        sqlTask('purge', sqlFile: 'src/main/sql/oracle/schema/Purge.sql')
        sqlTask('createSchema', sqlFile: 'src/main/sql/oracle/schema/CreateSchema.sql')
        sqlTask('loadTestdata', sqlFile: 'src/main/sql/oracle/data/LoadTestdata.sql')

        properties = project.properties

        credentials.username = db_username
        credentials.password = db_username
        url = "jdbc:oracle:thin:@${db_hostname}:${db_port}:${db_sid}"
    }

    /**
     * Toolset for SYSTEM-bruker
     */
    toolset(name: 'sa', type: 'oracle', prefix: 'sa') {
        sqlTask('grant', sqlFile: 'src/main/sql/oracle/schema/GrantRole.sql', description:'Denne må kjøres en gang før du får tilstrekkelige privilegier til å kjøre dbInit')

        properties = filterProperties

        credentials.username = admin_db_username
        credentials.password = admin_db_password
        url = "jdbc:oracle:thin:@${db_hostname}:${db_port}:${db_sid}"

    }

    /**
     * Template for tilleggelse av historikk
     */
    toolset(name: 'historikk', type: 'oracle', prefix: 'historikk') {

        //hjelpefunksjon for eksekveringsrekkefølge dersom task blir kjørt
        def dependsOnIfExecuted = { def task, def dependent ->
            gradle.taskGraph.whenReady { if (gradle.taskGraph.hasTask(dependent)) task.dependsOn(dependent)  }
            return task
        }

//        sqlTask('UpdateViewForTAND', sqlFile: 'src/main/sql/oracle/regina/UpdateHistorikkViewForTAND.sql') {
//            dependsOnIfExecuted it, sqlTask('HistorikkForTAND', sqlFile: 'src/main/sql/oracle/regina/ApplyHistorikkForTAND.sql')
//        }

        //kjøres før import
        sqlTask('purge', sqlFile: 'src/main/sql/oracle/schema/Purge.sql')

        //tasker for historikk mekanikk
        sqlTask('updatePackageSnapshotTime', sqlFile: 'src/main/sql/oracle/historikk/UpdatePackageSnapshotTime.sql') {
            dependsOn sqlTask('createSnapshotTrans', sqlFile: 'src/main/sql/oracle/historikk/CreateTemporaryTableSnapshotTrans.sql', failOnError:false) //feiler ikke dersom tabell allerede finnes fra før
        }


        filterProperties = [
                DATA_CONVERT_TIMESTAMP: '2012-09-02 00:00:00.00',   //dato for dump av kildebase som skal materialiseres
        ]

        credentials.username = admin_db_username
        credentials.password = admin_db_password
        url = "jdbc:oracle:thin:@${db_hostname}:${db_port}:${db_sid}"


        //samletasker..
        project.task('reginaUpdateAllViews', description: 'Oppdaterer historikk views og triggere for kilde-skjema') { def reginaUpdateAllViews ->
            tasks.getTasks().findAll {name, task -> name.startsWith 'UpdateViewFor'}.values().each {
                reginaUpdateAllViews.dependsOn it
                it.dependsOn tasks['updatePackageSnapshotTime']
            }
        }

        project.task('reginaApplyHistorikk', description: 'Etablerer historikk tabeller for kilde-skjema') {
            dependsOn tasks.getTasks().findAll {name, task -> name.startsWith 'HistorikkFor'}.values()
            dependsOn project.tasks['reginaUpdateAllViews']
        }

    }

}


task dbInit {
    description = 'Purger schema, oppretter schema og fyller inn testdata'

    int i = 0 //hacker til nytt lag av tasker da gradle 1.0 eksekverer dependencies i alfabetisk rekkefølge
    dependsOn project.task(String.format('%s_step%02d', it.name, ++i), dependsOn: dbToolSets[''].tasks['purge'])
    dependsOn project.task(String.format('%s_step%02d', it.name, ++i), dependsOn: dbToolSets[''].tasks['createSchema'])
    dependsOn project.task(String.format('%s_step%02d', it.name, ++i), dependsOn: dbToolSets[''].tasks['loadTestdata'])

}


apply from: 'genHistorikkTemplateTask.gradle'
genHistorikkTemplate.config.oracleConvention = project.convention.plugins['db'].dbToolSets[''] //credentials til bruker med les tilgang til alle schema
//GBOK-14: mulighet for ignorering av spesifike felt for tabeller
genHistorikkTemplate.config.ignoredColumnNames = []
