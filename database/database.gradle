apply plugin: 'statkart-dbutils-plugin'


configurations {
    drivers
}

dependencies {
    drivers libraries.ojdbc
}



configureDatabasePlugin {

    //todo: endre navn til db_hostname i plugin?
    if (hasProperty('db_host')) {
        setProperty 'db_hostname', properties['db_host']
    }

    useDrivers configurations.drivers

    useToolset('oracle', '', 'main/sql/oracle') {
        url = "jdbc:oracle:thin:@${project.property('db_hostname')}:${project.property('db_port')}:${project.property('db_sid')}"
    }

}

task dbInit {

    description = 'Purger schema, oppretter schema og fyller inn testdata'
    def mySqlTasks = [tasks.Purge, tasks.CreateSchema, tasks.LoadTestdata]

    mySqlTasks.each {
        dependsOn = it.dependsOn
    }

    doLast {
        mySqlTasks.each {
            println "${name} -> ${it.path}"
            it.execute()
        }
    }

}

task dbInitAsSystem {
    description = 'Fjerner brukere, oppretter brukere på nytt'
    def mySqlTasks = [tasks.RecreateUser]

    mySqlTasks.each {
        dependsOn = it.dependsOn
    }

    doLast {
        mySqlTasks.each {
            println "${name} -> ${it.path}"
            it.execute()
        }
    }
}

task dbInitAsHistUser {
    description = 'Populerer Hist-skjema, og granter rettigheter'
    def mySqlTasks = [tasks.PopulateHistSchema]

    mySqlTasks.each {
        dependsOn = it.dependsOn
    }

    doLast {
        mySqlTasks.each {
            println "${name} -> ${it.path}"
            it.execute()
        }
    }
}