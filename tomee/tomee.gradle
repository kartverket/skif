plugins {
    id 'java'
    id 'application'
}

//patch Tomcat modules to a newer version than what is provided by TomEE 
def tomcatVersion = libs.versions.tomee.tomcat.patch.get()
def tomcatModules = [
    "org.apache.tomcat:tomcat-api:${tomcatVersion}",
    "org.apache.tomcat:tomcat-annotations-api:${tomcatVersion}",
    "org.apache.tomcat:tomcat-catalina:${tomcatVersion}",
    "org.apache.tomcat:tomcat-catalina-ha:${tomcatVersion}",
    "org.apache.tomcat:tomcat-coyote:${tomcatVersion}",
    "org.apache.tomcat:tomcat-dbcp:${tomcatVersion}",
    "org.apache.tomcat:tomcat-el-api:${tomcatVersion}",
    "org.apache.tomcat:tomcat-jaspic-api:${tomcatVersion}",
    "org.apache.tomcat:tomcat-jasper:${tomcatVersion}",
    "org.apache.tomcat:tomcat-jasper-el:${tomcatVersion}",
    "org.apache.tomcat:tomcat-jdbc:${tomcatVersion}",
    "org.apache.tomcat:tomcat-jni:${tomcatVersion}",
    "org.apache.tomcat:tomcat-jsp-api:${tomcatVersion}",
    "org.apache.tomcat:tomcat-servlet-api:${tomcatVersion}",
    "org.apache.tomcat:tomcat-tribes:${tomcatVersion}",
    "org.apache.tomcat:tomcat-util:${tomcatVersion}",
    "org.apache.tomcat:tomcat-util-scan:${tomcatVersion}",
    "org.apache.tomcat:tomcat-websocket:${tomcatVersion}",
    "org.apache.tomcat:tomcat-websocket-api:${tomcatVersion}",
    "org.apache.tomcat:tomcat-websocket-client-api:${tomcatVersion}",
    "org.apache.tomcat:tomcat-juli:${tomcatVersion}",
]

dependencies {
// For konsumenter kan man ta inn plattform-constrains her      
//    implementation platform(project(':skif-platform'))
    implementation libs.tomee.embedded

    runtimeOnly libs.ojdbc
    
    constraints {
        tomcatModules.each { tomcatModule ->
            implementation(tomcatModule) { because 'Temporary security override until TomEE updates Tomcat' }
        }
    }
}

var deployments = [
    ':skif-service-test:skif-service-test-ear:ear',
    ':skif-store-test:skif-store-test-ear:ear',
    ':skif-wsversioning:skif-wsversioning-ear:ear',
]

var tomeeSpec = project.copySpec {
    into('apps') { a ->
        deployments.forEach {
            a.from(project.tasks.getByPath(it))
        }
    }
    from(project.file('src/main/tomee'))
}

application {
    mainClass = 'no.statkart.skif.tomee.RunServer'
    applicationDefaultJvmArgs = [
        '-Dskif.db_jdbc_url=' + db_jdbc_url,
        '-Dskif.db_username=' + db_username,
        '-Dskif.db_password=' + db_password,
        '-Dskif.db_datasource=openejb:Resource/no.statkart.skif.Skif_CURRENT',
        '-Dskif.db_datasource_old=openejb:Resource/no.statkart.skif.Skif_OLD',
        '-Djava.naming.factory.initial=org.apache.openejb.core.OpenEJBInitialContextFactory',
    ]
}

distributions {
    main {
        contents {
            with(tomeeSpec)
        }
    }
}

tasks.named('run', JavaExec).configure { JavaExec it ->
    dependsOn deployments

    var tmpDir = it.temporaryDir
    it.environment("APP_HOME", tmpDir.absolutePath)

    doFirst {
        project.sync {
            into(tmpDir)
            with(tomeeSpec)
        }
    }
}

tasks.withType(CreateStartScripts).configureEach { task ->
    task.doLast {
        // Classpath blir for lang for Windows. La Java finne alle filene selv.
        String text = task.windowsScript.text
        text = text.replaceFirst(/(set CLASSPATH=%APP_HOME%\\lib\\).*/, { "${it[1]}*" })
        task.windowsScript.write text
    }
}
