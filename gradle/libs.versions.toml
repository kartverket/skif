#Alfabetisk rekkefølge
[versions]
assertj = '3.27.7'
c3p0 = '0.12.0'
commons-pool = '2.12.1'
guava = '33.6.0-jre'
guice = '7.0.0'
hibernate-core-jakarta = '5.6.15.Final'
jakarta = '10.0.0'
jaxb-impl = '4.0.5'
jaxws-rt = '4.0.3'
jodatime = '2.10.1'
jws-api = '3.0.0'
logback = '1.5.32'
mockito = '4.7.0'
ojdbc = '19.12.0.0'
reflections = '0.10.2'
slf4j = '2.0.17'
testng = '7.12.0'
tomee = '10.1.4'
xstream = '1.4.21'

#Rekkefølge etter bruk
[libraries]
# Database
ojdbc  = { module = "com.oracle.database.jdbc:ojdbc8", version.ref = "ojdbc" }

c3p0            = { module = 'com.mchange:c3p0', version.ref = 'c3p0' }

# Logging
slf4j-api       = { module = 'org.slf4j:slf4j-api', version.ref = 'slf4j' }
jcl-to-slf4j    = { module = 'org.slf4j:jcl-over-slf4j', version.ref = 'slf4j' }
jul-to-slf4j    = { module = 'org.slf4j:jul-to-slf4j', version.ref = 'slf4j' }
log4j-to-slf4j  = { module = 'org.slf4j:log4j-over-slf4j', version.ref = 'slf4j' }
logback-classic = { module = 'ch.qos.logback:logback-classic', version.ref = 'logback' }

# Guice med extensions
guice       = { module = 'com.google.inject:guice', version.ref = 'guice' }

# Utility libraries
guava           = { module = 'com.google.guava:guava', version.ref = 'guava' }
xstream         = { module = 'com.thoughtworks.xstream:xstream', version.ref = 'xstream' }
commons-pool    = { module = 'org.apache.commons:commons-pool2', version.ref = 'commons-pool' }


jaxws-tools  = { module = 'com.sun.xml.ws:jaxws-tools', version = '4.0.3' }
jaxb-runtime = { module = 'org.glassfish.jaxb:jaxb-runtime', version = '4.0.6' }
jaxb-xjc     = { module = 'org.glassfish.jaxb:jaxb-xjc', version = '4.0.3' }

tomee-embedded = { module = 'org.apache.tomee:tomee-embedded', version.ref = 'tomee' }
openejb-core = { module = 'org.apache.tomee:openejb-core', version.ref = 'tomee' }

# Testing
testng = { module = 'org.testng:testng', version.ref = 'testng' } #husk exclude group:'junit' vi benytter ikke JUnit i prosjektet [SKIF-385]


mockito     = { module = 'org.mockito:mockito-core', version.ref = 'mockito' }
assertj     = { module = 'org.assertj:assertj-core', version.ref = 'assertj' }
reflections = { module = 'org.reflections:reflections', version.ref = 'reflections' }

# JAXB
xml-bind-jaxb-impl   = { module = 'com.sun.xml.bind:jaxb-impl', version.ref = 'jaxb-impl' }
jodatime    = { module = 'joda-time:joda-time', version.ref = 'jodatime' }

# commons-lang - vurderes i SKIF-271


# JAXB
jaxb-api = { module = 'jakarta.xml.bind:jakarta.xml.bind-api'}

# JAXWS
jaxws-api = { module = 'jakarta.xml.ws:jakarta.xml.ws-api'} # for kompilering
xml-ws-jaxb-rt = { module = 'com.sun.xml.ws:jaxws-rt', version.ref = 'jaxws-rt'}

jakarta-bom = { group = "jakarta.platform", name = "jakarta.jakartaee-bom", version.ref = "jakarta" }

jakarta-annotation-api  = { module = 'jakarta.annotation:jakarta.annotation-api'}
jakarta-serverlet-api   = { module = 'jakarta.servlet:jakarta.servlet-api'}
jakarta-transaction-api = { module = 'jakarta.transaction:jakarta.transaction-api'}
jakarta-ejbapi          = { module = 'jakarta.ejb:jakarta.ejb-api'}
jakarta-interceptor-api = { module = 'jakarta.interceptor:jakarta.interceptor-api'}

hibernate-core-jakarta = { module = 'org.hibernate:hibernate-core-jakarta', version.ref = 'hibernate-core-jakarta'}

[bundles]
# for kjøring utenfor container
jaxws-rt = [
    'xml-bind-jaxb-impl',
    'xml-ws-jaxb-rt'
]

hibernate = [
    'hibernate-core-jakarta'
]

# javax.javaee-api:6.0 virker ikke for testing fordi det er gjort noe rart med klassene
jee = [
    'jakarta-annotation-api',
    'jakarta-serverlet-api',
    'jakarta-transaction-api',
    'jakarta-ejbapi',
    'jakarta-interceptor-api',
]
