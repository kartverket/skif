# Optional configuration of library versions to use.
# Simply add version properties to your gradle.property file to use this feature.


[versions]
slf4j = '1.7.32'
tomee = '9.1.3'
oracle = '19.12.0.0'
logback = '1.4.14'
guice = '6.0.0'

# build a map of the dependency artifacts to use. Allows centralized definition of the versions of artifacts to
# use. In that respect it serves a role similar to <dependencyManagement> in Maven
[libraries]
# Database
ojdbc           = { module = 'com.oracle.database.jdbc:ojdbc8', version.ref = 'oracle' } # husk @jar
ojdbc-g         = { module = 'com.oracle.database.jdbc.debug:ojdbc8_g', version.ref = 'oracle' } # husk @jar

c3p0            = { module = 'com.mchange:c3p0', version = '0.9.5.5' }

# Logging
slf4j-api       = { module = 'org.slf4j:slf4j-api', version.ref = 'slf4j' }
jcl-to-slf4j    = { module = 'org.slf4j:jcl-over-slf4j', version.ref = 'slf4j' }
jul-to-slf4j    = { module = 'org.slf4j:jul-to-slf4j', version.ref = 'slf4j' }
log4j-to-slf4j  = { module = 'org.slf4j:log4j-over-slf4j', version.ref = 'slf4j' }
logback-classic = { module = 'ch.qos.logback:logback-classic', version.ref = 'logback' }

# Guice med extensions
guice       = { module = 'com.google.inject:guice', version.ref = 'guice' }

# Utility libraries
guava           = { module = 'com.google.guava:guava', version = '32.1.2-jre' }
jsr305          = { module = 'com.google.code.findbugs:jsr305', version = '3.0.2' }
xstream         = { module = 'com.thoughtworks.xstream:xstream', version = '1.4.20' }
commons-pool    = { module = 'org.apache.commons:commons-pool2', version = '2.11.1' }


jaxws-tools  = { module = 'com.sun.xml.ws:jaxws-tools', version = '3.0.2' }
jaxb-runtime = { module = 'org.glassfish.jaxb:jaxb-runtime', version = '3.0.2' }
jaxb-xjc     = { module = 'org.glassfish.jaxb:jaxb-xjc', version = '3.0.2' }

tomee-embedded = { module = 'org.apache.tomee:tomee-embedded', version.ref = 'tomee' }
openejb-core = { module = 'org.apache.tomee:openejb-core', version.ref = 'tomee' }

# Testing
testing = { module = 'org.testng:testng', version = '6.14.3' } #husk exclude group:'junit' vi benytter ikke JUnit i prosjektet [SKIF-385]


mockito     = { module = 'org.mockito:mockito-core', version = '4.7.0' }
unitils     = { module = 'org.unitils:unitils-core', version = '3.4.6' }
assertj     = { module = 'org.assertj:assertj-core', version = '3.23.1' }
reflections = { module = 'org.reflections:reflections', version = '0.10.2' }

# JAXB
xml-bind-jaxb-impl   = { module = 'com.sun.xml.bind:jaxb-impl', version = '3.0.2' }
jodatime    = { module = 'joda-time:joda-time', version = '2.10.1' }

# commons-lang - vurderes i SKIF-271


# JAXB
jaxb-api = { module = 'jakarta.xml.bind:jakarta.xml.bind-api', version='3.0.1' }

# JAXWS
jaxws-api = { module = 'jakarta.xml.ws:jakarta.xml.ws-api', version='3.0.1' } # for kompilering
jws-api   = { module = 'jakarta.jws:jakarta.jws-api', version='3.0.0' }
xml-ws-jaxb-impl = { module = 'com.sun.xml.ws:jaxws-rt', version = '3.0.2'}


jakarta-annotation-api  = { module = 'jakarta.annotation:jakarta.annotation-api', version = '2.1.1' }
jakarta-serverlet-api   = { module = 'jakarta.servlet:jakarta.servlet-api', version = '5.0.0' }
jakarta-transaction-api = { module = 'jakarta.transaction:jakarta.transaction-api', version = '2.0.1' }
jakarta-ejbapi          = { module = 'jakarta.ejb:jakarta.ejb-api', version = '4.0.1' }
jakarta-interceptor-api = { module = 'jakarta.interceptor:jakarta.interceptor-api', version = '2.1.0' }

#intern ##TODO!
skif-bubble-spi        = { module = 'no.statkart.skif:skif-bubble-spi', version = '1.0.0'}
skif-hibernate-support = { module = 'no.statkart.skif:skif-hibernate-support', version = '2.0.2'}
hibernate-core-jakarta = { module = 'org.hibernate:hibernate-core-jakarta', version = '5.6.15.Final.bubbleref.1'}

[bundles]
# for kjøring utenfor container
jaxws-rt = [
    'jaxws-api',
    'xml-ws-jaxb-impl'
]

hibernate = [
    'skif-hibernate-support',
    'hibernate-core-jakarta'
]

# javax.javaee-api:6.0 virker ikke for testing fordi det er gjort noe rart med klassene
jee = [
    'jakarta-annotation-api',
    'jakarta-serverlet-api',
    'jakarta-transaction-api',
    'jakarta-ejbapi',
    'jakarta-interceptor-api',
]
