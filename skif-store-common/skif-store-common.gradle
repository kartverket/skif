plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Inneholder Store funksjonalitet samt mulighet for remote service kall (via transitiv dependency skif-service-common)'

java {
    // TODO: Skill det testene bruker fra selve testene
    registerFeature('test') {
        usingSourceSet(sourceSets.test)
    }

    withSourcesJar()
}

dependencies {
    api enforcedPlatform(project(':skif-store-platform'))

    api project(':skif-service-common')
    api 'no.statkart.skif:skif-bubble-spi'
    implementation 'com.google.guava:guava'

    testApi enforcedPlatform(project(':skif-internal-platform'))

    testImplementation project(':skif-config')
    testImplementation project(':skif-testsupport-common')

    testImplementation 'org.reflections:reflections'
    testImplementation 'org.assertj:assertj-core'
}

components.java {
    // Disse skal bare brukes internt
    withVariantsFromConfiguration(configurations.testApiElements) {
        skip()
    }
    withVariantsFromConfiguration(configurations.testRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

task assertDependencies() {
    doFirst {
        configurations.runtimeElements.copyRecursive{it instanceof ExternalDependency}.dependencies.each { Dependency dependency ->
            boolean godkjent = [ //liste over dependencies. For syntax se parsing under..
                    'org.slf4j',
                    'com.google.inject:guice',
                    'com.google.inject.extensions:guice-',
                    'com.google.guava',
                    'no.statkart.skif:skif-bubble-spi'
            ].find { "${dependency.group}:${dependency.name}:${dependency.version}".startsWith(it) }

            if (!godkjent) {
                throw new TaskExecutionException(it, new RuntimeException('Ukjent avhengighet: ' + dependency)) //avhengighet ikke i godkjent-liste
            }
        }
    }
}
check.dependsOn assertDependencies //kjøres som en test
