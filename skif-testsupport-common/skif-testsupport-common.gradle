apply plugin: 'java'
apply plugin: 'maven'

dependencies {
    compile project(':skif-service-common')
    compile libraries['testng'], {
        //denne må ekskluderes på samme av prosjekter som benytter produsert jar, ellers så vil en ha en transitiv dependency til JUnit [SKIF-385]
        exclude group:'junit' // vi benytter ikke JUnit i prosjektet
    }
}

task sourcesJar(type: Jar, dependsOn:classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
    onlyIf { gradle.taskGraph.hasTask(install) || gradle.taskGraph.hasTask(uploadArchives) } //only when published..
}

artifacts {
    archives sourcesJar
}