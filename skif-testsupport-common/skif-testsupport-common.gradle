plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api project(':skif-service-common')
    api (libs.testng){
        exclude group:'junit' // vi benytter ikke JUnit i prosjektet [SKIF-385]
    }
    compileOnly libs.jaxws.api
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/kartverket/skif"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
