plugins {
    id 'java'
}

dependencies {
    implementation project(':skif-service-test:skif-service-test-api')
    implementation project(':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wsmapping')
    implementation project(':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wsclient')

    implementation libs.bundles.jee
    implementation libs.c3p0

    testImplementation project(':skif-testsupport-common')
    testImplementation project(':skif-service-test:skif-service-test-server') //trenger denne avhengighet for testing av servicer
    testImplementation project(':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wswar')

    //internal dependencies + optional deps to logging frameworks:
    testImplementation project(':skif-config')

    testImplementation libs.bundles.jaxws.rt
    if (System.getenv('ORA-DEBUG') == 'true') {
        implementation libs.ojdbcg
    } else {
        implementation libs.ojdbc
    }

}
