apply plugin: 'java'

dependencies {
    compile project(':skif-service-test:skif-service-test-api')
    compile project(':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wsmapping')
    compile project(':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wsclient')

    provided libraries.jaxws_rt
    provided libraries.c3p0
    provided libraries.weblogic
    provided libraries.jdbc

    testCompile project(':skif-testsupport-common')
    testCompile project(':skif-service-test:skif-service-test-server') //trenger denne avhengighet for testing av servicer
    testCompile project(path: ':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wswar')

    //internal dependencies + optional deps to logging frameworks:
    testCompile project(':skif-config')
}