plugins {
    id 'java-library'
    id 'sktools.provided'
}

java {
    registerFeature('springSupport') {
        usingSourceSet(sourceSets.main)
    }
}

configurations {
    sprigSupportApi.extendsFrom api
    springSupportImplementation.extendsFrom implementation
    springSupportCompileOnly.extendsFrom compileOnly
}

dependencies {
    api project(':skif-service-server')
    api project(':skif-service-test:skif-service-test-api')

    provided libraries.jee
    provided libraries.c3p0
    provided libraries.jdbc

    testImplementation project(':skif-testsupport-common')

    //internal dependencies + optional deps to logging frameworks:
    testImplementation project(':skif-config')

    springSupportImplementation 'org.springframework:spring-context:5.3.12'
    springSupportImplementation 'org.aspectj:aspectjweaver:1.9.7'
    springSupportImplementation  'org.springframework:spring-tx:5.3.12'
    springSupportImplementation  'org.springframework:spring-jdbc:5.3.12'
    springSupportImplementation  'org.springframework.boot:spring-boot-autoconfigure:2.5.6'
}
