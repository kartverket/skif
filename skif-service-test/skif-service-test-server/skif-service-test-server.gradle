plugins {
    id 'java-library'
    id 'singlevm-variant'
}

dependencies {
    api project(':skif-service-server')
    api project(':skif-service-test:skif-service-test-api')

    singlevmImplementation(project(':skif-service-server')) {
        capabilities {
            requireCapability("${project.group}:skif-service-server-singlevm")
        }
    }

    testImplementation project(':skif-testsupport-common')

    //internal dependencies + optional deps to logging frameworks:
    testImplementation project(':skif-config')
}
