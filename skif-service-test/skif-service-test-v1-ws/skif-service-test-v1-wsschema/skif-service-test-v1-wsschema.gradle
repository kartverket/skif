plugins {
  id 'java'
  id 'sktools.xjc'
}

dependencies {
  implementation libraries.jaxws_api
  implementation libraries.jaxb_api
}

sourceSets {
  main {
    xjc {
      schema {
        srcDir 'src/main/schema'
        getWithSkDoc from: 'no.statkart.skif.skiftest.wsapi.domain', to: 'no.statkart.skif.skiftest.domain'
      }
    }
    resources.srcDirs = []
  }
}

