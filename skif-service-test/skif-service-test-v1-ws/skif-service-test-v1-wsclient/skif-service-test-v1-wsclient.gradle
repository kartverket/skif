apply plugin: 'java'
apply plugin: 'sktools-weblogic-wsclient-plugin'


dependencies {
  weblogicProvided project(':skif-config') // For å tvinge bruk av JAX-WS RI og JAXB RI
  weblogicProvided libraries.weblogic
  weblogicProvided libraries['tools.jar']
}

weblogicWsClient {
  webService {
    baseWar { project(path: ':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wswar', configuration: 'wsdls') }
    exceptionReusePackage 'no.statkart.skif.skiftest.wsapi.exception'
  }
}
