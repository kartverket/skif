apply plugin: 'java'
apply plugin: 'sktools-weblogic-wsclient-plugin'


dependencies {
  weblogicProvided libraries.weblogic_tools
  weblogicProvided libraries['tools.jar']
}

weblogicWsClient {
  webService {
    baseWar { project(path: ':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wswar', configuration: 'weblogic') }
    exceptionReusePackage 'no.statkart.skif.skiftest.wsapi.exception'
  }
}
