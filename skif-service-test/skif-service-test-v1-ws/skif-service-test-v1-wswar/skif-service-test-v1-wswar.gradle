apply plugin: 'sktools-wsgen-plugin'

configurations {
    war { description = 'War-artifaktet' }
    wsdls { description = 'Zip med WSDL-er' }
}

dependencies {
    compile project(':skif-service-server')
    compile project(':skif-service-test:skif-service-test-api')
    compile project(':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wsmapping')
    compile project(':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wsschema')

    provided libraries.jee

    jaxws libraries.jaxws_tools
}

war {
    // Skinny war
    classpath = sourceSets.main.output
}

task zipWsdls(type: Zip) {
    classifier = 'wsdls'
    extension = 'war'
    from genWsdls
}

artifacts {
    wsdls zipWsdls
    war project.war
}
