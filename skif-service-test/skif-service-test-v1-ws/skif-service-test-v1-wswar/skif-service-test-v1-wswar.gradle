plugins {
    id 'sktools.wsgen'
    id 'singlevm-variant'
    id 'skinny-war'
}

configurations {
    wsdls { description = 'Zip med WSDL-er' }
}

dependencies {
    implementation project(':skif-service-server')
    implementation project(':skif-service-test:skif-service-test-api')
    implementation project(':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wsmapping')
    implementation project(':skif-service-test:skif-service-test-v1-ws:skif-service-test-v1-wsschema')

    provided libraries.jee
    provided libraries.jaxws_rt
}

task zipWsdls(type: Zip) {
    archiveAppendix = 'wsdls'
    from genWsdls
}

artifacts {
    wsdls zipWsdls
}
