plugins {
    id 'java-library'
    id 'maven-publish'
    id 'singlevm-variant'
}

description = 'Inneholder service-rammeverk klasser for tjener'

dependencies {
    api project(':skif-service-common')

    provided libraries.jee
    provided libraries.c3p0 // er kun brukt for intern testfunksjonalitet - burde kanskje ligge et annet sted

    singlevmImplementation libraries.jaxws_rt
    singlevmImplementation libraries.jdbc
    singlevmImplementation(project(':skif-service-common')) {
        capabilities {
            requireCapability("${project.group}:skif-service-common-singlevm")
        }
    }

    testImplementation project(':skif-config')
    testImplementation project(':skif-testsupport-common')
    testImplementation(project(':skif-service-common')) {
        capabilities {
            requireCapability("${project.group}:skif-service-common-test")
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
