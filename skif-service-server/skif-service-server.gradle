apply plugin: 'maven'

configurations {
    tests
}

dependencies {
    compile project(':skif-service-common')
    provided libraries.weblogic
    provided libraries.ojdbc

    testCompile project(':skif-config')
    testCompile project(':skif-testsupport-common')
    testCompile project(path: ':skif-service-common', configuration: "testApi")
}

task sourcesJar(type: Jar, dependsOn:classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
    onlyIf { gradle.taskGraph.hasTask(install) || gradle.taskGraph.hasTask(uploadArchives) } //only when published..
}

task testJar(type: Jar) {
    classifier = 'tests'
    from sourceSets.test.classes
}


artifacts {
    tests testJar
    archives sourcesJar
}
