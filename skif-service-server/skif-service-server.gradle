apply plugin: 'java-library'
apply plugin: 'maven'

description = 'Inneholder service-rammeverk klasser for tjener'

dependencies {
    api project(':skif-service-common')

//    implementation libraries.guice_for_server
    implementation libraries.c3p0

    compileOnly libraries.weblogic

    testImplementation project(':skif-config')
    testImplementation project(':skif-testsupport-common')
    testImplementation project(path: ':skif-service-common', configuration: 'testApi')
    testImplementation libraries.jdbc
    testImplementation libraries.weblogic
}

task sourcesJar(type: Jar, dependsOn:classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
    onlyIf { gradle.taskGraph.hasTask(install) || gradle.taskGraph.hasTask(uploadArchives) } //only when published..
}


artifacts {
    archives sourcesJar
}

def installer = install.repositories.mavenInstaller
def deployer = uploadArchives.repositories.findByName('mavenDeployer')
[installer, deployer]*.pom*.whenConfigured {pom ->
    ((List) pom.dependencies).removeIf { dep -> dep.groupId == 'no.statkart.skif' && dep.artifactId == 'skif-service-common' && dep.scope == 'test' }
}
