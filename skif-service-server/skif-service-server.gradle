plugins {
    id 'java-library'
    id 'maven-publish'
    id 'singlevm-variant'
}

description = 'Inneholder service-rammeverk klasser for tjener'

dependencies {
    api project(':skif-service-common')

    provided libraries.jee

    singlevmImplementation libraries.jaxws_rt
    singlevmImplementation libraries.jdbc
    singlevmImplementation(project(':skif-service-common')) {
        capabilities {
            requireCapability("${project.group}:skif-service-common-singlevm")
        }
    }

    testImplementation project(':skif-config')
    testImplementation project(':skif-testsupport-common')
    testImplementation(project(':skif-service-common')) {
        capabilities {
            requireCapability("${project.group}:skif-service-common-test")
        }
    }
    testImplementation libraries.c3p0
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

task assertDependencies() {
    doFirst {
        configurations.apiElements.copyRecursive{it instanceof ExternalDependency}.dependencies.each { Dependency dependency ->
            boolean godkjent = [
                    'joda-time',
                    'org.slf4j',
                    'com.google.inject:guice',
                    'com.google.guava:guava',
                    'javax.annotation:javax.annotation-api:1.2',
                    'javax.servlet:javax.servlet-api:3.0.1',
                    'javax.transaction:jta:1.1',
                    'javax.ejb:ejb-api:3.0',
            ].find { "${dependency.group}:${dependency.name}:${dependency.version}".startsWith(it) }

            if (!godkjent) {
                throw new TaskExecutionException(it, new RuntimeException('Ukjent avhengighet: ' + dependency)) //avhengighet ikke i godkjent-liste
            }
        }
        configurations.runtimeElements.copyRecursive{it instanceof ExternalDependency}.dependencies.each { Dependency dependency ->
            boolean godkjent = [
                    'joda-time',
                    'org.slf4j',
                    'com.google.inject:guice',
                    'com.google.guava:guava',
            ].find { "${dependency.group}:${dependency.name}:${dependency.version}".startsWith(it) }

            if (!godkjent) {
                throw new TaskExecutionException(it, new RuntimeException('Ukjent avhengighet: ' + dependency)) //avhengighet ikke i godkjent-liste
            }
        }
    }
}
test.dependsOn assertDependencies //kjøres som en test
