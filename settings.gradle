rootProject.name = 'skif'

rootProject.children.each { project -> configureProject(project) }
void configureProject(ProjectDescriptor project) {
    project.buildFileName = "${project.name}.gradle"
    assert project.projectDir.isDirectory()

    project.children.each { configureProject(it) }
}

// Include build for arbeid på tvers av prosjekter
// - konfigureres feks via gradle.properties: includeBuild.wsclient=../matrikkel-wsclient
ext.getProperties().findAll {(it.key as String).startsWith('includeBuild.')}.each {
    println 'Include build ' + file(it.value)
    includeBuild it.value
}
