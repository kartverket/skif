######################
### Query Language ###
######################

## define query language constants / function names

hibernate.query.substitutions=true 1, false 0, yes 'Y', no 'N'

## package imports

#hibernate.query.imports=org.hibernate.test, org.hibernate.eg

#################
### Platforms ###
#################

hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
hibernate.connection.driver_class=oracle.jdbc.OracleDriver

#hibernate.hbm2ddl.auto=create
#hibernate.hbm2ddl.auto=update

## URL
#hibernate.connection.url=jdbc:oracle:thin:@@db_hostname@:@db_port@:@db_sid@
#hibernate.connection.username=@db_username@
#hibernate.connection.password=@db_password@


## JNDI Datasource - to be used when running inside an application server
#hibernate.connection.datasource=@db_datasource@


#################################
### Hibernate Connection Pool ###
#################################

hibernate.connection.pool_size=1
hibernate.statement_cache.size=25


#################################
### Plugin ConnectionProvider ###
#################################

## use a custom ConnectionProvider (if not set, Hibernate will choose a built-in ConnectionProvider using hueristics)

#hibernate.connection.provider_class=org.hibernate.connection.DriverManagerConnectionProvider
#hibernate.connection.provider_class=org.hibernate.connection.DatasourceConnectionProvider
#hibernate.connection.provider_class=org.hibernate.connection.C3P0ConnectionProvider
#hibernate.connection.provider_class=org.hibernate.connection.DBCPConnectionProvider



#######################
### Transaction API ###
#######################

## the Transaction API abstracts application code from the underlying JTA or JDBC transactions

#hibernate.transaction.factory_class=org.hibernate.transaction.JTATransactionFactory
#hibernate.transaction.factory_class=org.hibernate.transaction.JDBCTransactionFactory


## to use JTATransactionFactory, Hibernate must be able to locate the UserTransaction in JNDI
## default is java:comp/UserTransaction

#jta.UserTransaction jta/usertransaction
jta.UserTransaction=javax.transaction.UserTransaction

#jta.UserTransaction javax.transaction.UserTransaction
#jta.UserTransaction=UserTransaction


## to use JTATransactionFactory with JCS caching, Hibernate must be able to obtain the JTA TransactionManager

#hibernate.transaction.manager_lookup_class=org.hibernate.transaction.WeblogicTransactionManagerLookup



##############################
### Miscellaneous Settings ###
##############################

## print all generated SQL to the console

hibernate.show_sql=false


## specify a JDBC isolation level

#hibernate.connection.isolation=4


## set the JDBC fetch size

hibernate.jdbc.fetch_size=500


## set the maximum JDBC 2 batch size (a nonzero value enables batching)

hibernate.jdbc.batch_size=50


## enable use of JDBC 2 scrollable ResultSets (specifying a Dialect will cause Hibernate to use a sensible default)

#hibernate.jdbc.use_scrollable_resultset=true


## use streams when writing binary types to / from JDBC
hibernate.jdbc.use_streams_for_binary=true


## specify a default schema for unqualified tablenames

#hibernate.default_schema=test


## use a custom stylesheet for XML generation (if not specified, hibernate-default.xslt will be used)

#hibernate.xml.output_stylesheet=C:/Hibernate/net/sf/hibernate/hibernate-default.xslt


## enable outerjoin fetching (specifying a Dialect will cause Hibernate to use sensible default)
hibernate.use_outer_join=true
#hibernate.max_fetch_depth=20


## enable CGLIB reflection optimizer (enabled by default)
hibernate.bytecode.use_reflection_optimizer=true


############
### JNDI ###
############

## specify a JNDI name for the SessionFactory

## Hibernate uses JNDI to bind a name to a SessionFactory and to look up the JTA UserTransaction;
## if hibernate.jndi.* are not specified, Hibernate will use the default InitialContext() which
## is the best approach in an application server

#file system
#hibernate.jndi.class=com.sun.jndi.fscontext.RefFSContextFactory
#hibernate.jndi.url=file:/

#WebSphere
#hibernate.jndi.class=com.ibm.websphere.naming.WsnInitialContextFactory
#hibernate.jndi.url=iiop://localhost:900/

