plugins {
    id 'ear'
    id 'java-base'
}

def warMap = [
        ':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wswar': 'storetest/wsapi',
]

def ejbList = [
        ':skif-store-test:skif-store-test-server'
]

dependencies {
    ejbList.each {
        def p = project(it)
        deploy p
        earlib p
    }
    warMap.each {
        deploy project(path: it.key, configuration: 'war')
        earlib project(path: it.key, configuration: 'earlib')
    }

    // TODO: Bør noen av de andre modulene trekke med seg denne (de har den nå på testCompile)?
    earlib project(':skif-config')
}

libDirName = 'APP-INF/lib'
deploymentDescriptor {
    version = '5'
    displayName = 'skif-store-test'
    warMap.each {
        def p = project(it.key)
        webModule(p.name + '-' + p.version + '.war', it.value)
    }
}
