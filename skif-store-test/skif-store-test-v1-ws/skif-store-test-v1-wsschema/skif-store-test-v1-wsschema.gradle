plugins {
    id 'java-library'
    id 'sktools.xjc'
}

dependencies {
    implementation libraries.jaxws_api
    implementation libraries.jaxb_api

    compileOnly "org.glassfish.jaxb:jaxb-runtime:$JAXB_VERSION"
    jaxb "org.glassfish.jaxb:jaxb-xjc:$JAXB_VERSION"
}

configurations {
    schemas {
        description = 'Configuration for publishing schemas'
    }
}

sourceSets {
  main {
    xjc {
      schema {
        srcDir 'src/main/schema'
      }
    }
    resources.srcDirs = []
  }
}


task zipSchemas(type: Zip) {
    archiveClassifier = 'schemas'
    from 'src/main/schema'
}

artifacts {
    schemas zipSchemas
}
