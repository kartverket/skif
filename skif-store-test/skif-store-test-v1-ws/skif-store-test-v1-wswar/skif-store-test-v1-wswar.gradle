apply plugin: 'sktools-wsgen-plugin'

configurations {
    schemas { description = 'Configuration for consuming schemas' }
    war { description = 'War-artifaktet' }
    wsdls { description = 'Zip med WSDL-er' }
}

dependencies {
    if(hibernateVersion.equals("3.6")){
        compile project(':skif-store-server:skif-store-server-hs36')
    }
    compile project(':skif-store-test:skif-store-test-api')
    compile project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsmapping')
    compile project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsschema')

    provided libraries.weblogic

    jaxws libraries['tools.jar']
    jaxws libraries.weblogic_tools

    schemas project(path: ':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsschema', configuration: 'schemas')
}

task zipWsdlsAndSchemas(type: Zip) { Task t ->
    baseName = 'schemas'

    dependsOn configurations.schemas
    from { configurations.schemas.files.collect { project.zipTree it } }

    from genWsdls {
        include '**/*.wsdl'
        include '**/*schema1.xsd'
    }

    includeEmptyDirs = false
}

task zipWsdls(type: Zip) {
    classifier = 'wsdls'
    extension = 'war'
    from genWsdls
}

war {
    // Skinny war
    classpath = sourceSets.main.output

    from zipWsdls
}

artifacts {
    wsdls zipWsdls
    war project.war
}
