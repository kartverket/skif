apply plugin: 'sktools-weblogic-wswar-plugin'

configurations {
    schemas {
        description = 'Configuration for consuming schemas'
    }
}

sourceSets.weblogic {
    java.srcDirs = ['src/main/java']
    resources.srcDirs = []
}


warWeblogic {
    from 'src/main/webapp'
}


dependencies {
    if(hibernateVersion.equals("3.6")){
        weblogicCompile project(':skif-store-server:skif-store-server-hs36')
    }
    weblogicCompile project(':skif-store-test:skif-store-test-api')
// Havner tydeligvis på compile classpath   weblogicRuntime project(':skif-store-test:skif-store-test-server')
    weblogicCompile project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsmapping')
    weblogicCompile project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsschema')

    weblogicProvided libraries['tools.jar']
    weblogicProvided libraries.weblogic

    schemas project(path: ':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsschema', configuration: 'schemas')
}

task zipWsdlsAndSchemas(type: Zip) { Task t ->
    baseName = 'schemas'

    project.tasks.withType(no.statkart.sktools.gradle.plugins.weblogic.wswar.WeblogicWsCompileTask).all { Task wwct ->
        t.dependsOn wwct
        t.from {
            t.project.fileTree(dir: wwct.getGenDir(), includes: ['**/*.wsdl', '**/*schema1.xsd']).files
        }
    }

    dependsOn configurations.schemas
    from { configurations.schemas.files.collect { project.zipTree it } }

    includeEmptyDirs = false
}

warWeblogic {
    from zipWsdlsAndSchemas
}
