apply plugin: 'java'

dependencies {
    compile project(':skif-store-test:skif-store-test-api')
    compile project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsmapping')
    runtime project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsclient')

    provided libraries.jaxws_rt
    provided libraries.c3p0
    provided libraries.weblogic
    provided libraries.jdbc

    testCompile project(':skif-testsupport-common')
    testCompile project(':skif-store-test:skif-store-test-server')
    testCompile project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsclient')


    testCompile libraries.dbunit //optional library for testing
    testCompile libraries.unitils //optional library for testing
    testCompile libraries.xstream // Brukes i test

    //internal dependencies + optional deps to logging frameworks:
    testCompile project(':skif-config')

}

task loadMockupData(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    maxHeapSize = '1024m'
    main = 'no.statkart.skif.storetest.mockup.LoadTestdata'
}
