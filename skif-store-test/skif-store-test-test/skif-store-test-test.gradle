plugins {
    id 'java'
    id 'sktools.provided'
}

dependencies {
    implementation project(':skif-store-test:skif-store-test-api')
    implementation project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsmapping')
    runtimeOnly project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsclient')

    provided libraries.jee
    provided libraries.c3p0
    provided libraries.jdbc

    testImplementation project(':skif-testsupport-common')
    testImplementation project(':skif-store-test:skif-store-test-server')
    testImplementation project(':skif-store-test:skif-store-test-v1-ws:skif-store-test-v1-wsclient')


    testImplementation libraries.unitils //optional library for testing
    testImplementation libraries.xstream // Brukes i test

    //internal dependencies + optional deps to logging frameworks:
    testImplementation project(':skif-config')
    testImplementation libraries.logback_classic
}

task loadMockupData(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    maxHeapSize = '1024m'
    mainClass = 'no.statkart.skif.storetest.mockup.LoadTestdata'
}
