wsProject = project(':skif-store-test:skif-store-test-wswar')

wsTargetDir = file('build/generated/main/java')
wsResourcesDir = file('build/generated/main/resources')
sourceSets.main.java.srcDirs = [wsTargetDir]
sourceSets.main.resources.srcDirs = [wsResourcesDir]

// Source is in the build directory so we need to unexclude it
idea.module.iml {
    whenMerged {
        it.excludeFolders = it.excludeFolders.findAll {!it.url.contains("build")}
    }
}

dependencies {
    compile project(':skif-store-test:skif-store-test-wsmapping')
}

//task genWsclient(dependsOn: ':skif-store-test:skif-store-test-wswar:jar') {
task genWsclient(dependsOn: ':skif-store-test:skif-store-test-wswar:jar') {
    inputs.dir file(wsProject.jar.archivePath)
    outputs.dir wsTargetDir

    doLast {
        ant.taskdef(name: 'clientgen', classname: 'weblogic.wsee.tools.anttasks.ClientGenTask', classpath: libraries.weblogic.asPath)
        ant.importBuild 'skif-store-test-wsclient-build.xml'

        ant.delete(dir: "${wsTargetDir}")
        wsTargetDir.mkdirs()

        ant.clientgen(wsdl: "jar:file:${wsProject.jar.archivePath}!/WEB-INF/StoreServiceWS.wsdl", destdir: wsTargetDir, includeGlobalTypes: 'true', copywsdl: 'true', type: 'JAXWS')
        ant.clientgen(wsdl: "jar:file:${wsProject.jar.archivePath}!/WEB-INF/KodelisteServiceWS.wsdl", destdir: wsTargetDir, includeGlobalTypes: 'true', copywsdl: 'true', type: 'JAXWS')
        ant.clientgen(wsdl: "jar:file:${wsProject.jar.archivePath}!/WEB-INF/StoreTest1ServiceWS.wsdl", destdir: wsTargetDir, includeGlobalTypes: 'true', copywsdl: 'true', type: 'JAXWS')
        ant.clientgen(wsdl: "jar:file:${wsProject.jar.archivePath}!/WEB-INF/BeanManagedTxAServiceWS.wsdl", destdir: wsTargetDir, includeGlobalTypes: 'true', copywsdl: 'true', type: 'JAXWS')
        ant.clientgen(wsdl: "jar:file:${wsProject.jar.archivePath}!/WEB-INF/ContainerManagedTxAServiceWS.wsdl", destdir: wsTargetDir, includeGlobalTypes: 'true', copywsdl: 'true', type: 'JAXWS')
        ant.clientgen(wsdl: "jar:file:${wsProject.jar.archivePath}!/WEB-INF/ContainerManagedTxCMTCascadeServiceWS.wsdl", destdir: wsTargetDir, includeGlobalTypes: 'true', copywsdl: 'true', type: 'JAXWS')
        ant.clientgen(wsdl: "jar:file:${wsProject.jar.archivePath}!/WEB-INF/SequenceBlockAllocatorServiceWS.wsdl", destdir: wsTargetDir, includeGlobalTypes: 'true', copywsdl: 'true', type: 'JAXWS')
        ant.clientgen(wsdl: "jar:file:${wsProject.jar.archivePath}!/WEB-INF/HistTestServiceWS.wsdl", destdir: wsTargetDir, includeGlobalTypes: 'true', copywsdl: 'true', type: 'JAXWS')
        ant.clientgen(wsdl: "jar:file:${wsProject.jar.archivePath}!/WEB-INF/LockingTestServiceWS.wsdl", destdir: wsTargetDir, includeGlobalTypes: 'true', copywsdl: 'true', type: 'JAXWS')

        // clientgen compiles automatically files into destdir, but we need to fix source an compile again to another location
        ant.delete(dir: wsTargetDir) {include(name: '**/*.class')}
        ant.copy(todir: wsResourcesDir) {
            fileset(dir: wsTargetDir, includes: '**/*.wsdl,**/*.xsd')
        }

        ant.properties['wsTargetDir'] = wsTargetDir
        wsClientFixExceptions.execute()

        // SKIF-82: Fix elementFormDefault i package-info.java for domeneklasser dersom den mangler. Pakker som inneholder services skal ikke endres, da disse ikke bruker qualified.
        // Skriv ut hvilke filer som faktisk endres
        packageInfoFiles = fileTree {
            from 'build/generated/main/java'
            include '**/package-info.java'
            exclude '**/service/**'
        }
        packageInfoFiles.each { File file ->
            newFile = new File('temp')
            newFile.withWriter { out ->
                file.eachLine { line ->
                    if (line =~ '@javax.xml.bind.annotation.XmlSchema\\(namespace = "(.*)"\\)') {
                        println 'Adding missing "elementFormDefault = QUALIFIED"  to: ' + file.path;
                        out.println line.replaceFirst('@javax.xml.bind.annotation.XmlSchema\\(namespace = "(.*)"\\)', '@javax.xml.bind.annotation.XmlSchema(namespace =  "$1",  elementFormDefault = javax.xml.bind.annotation.XmlNsForm.QUALIFIED)')
                    } else {
                        out.println line
                    }
                }
            }
            file.delete()
            newFile.renameTo(file.path)
        }
    }
}
compileJava.dependsOn genWsclient
ideaModule.dependsOn genWsclient
