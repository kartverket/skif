apply plugin: 'java'

configurations {
    client
}

dependencies {
    compile project(':skif-store-test:skif-store-test-api')

    //tester disse implementasjonene her..
    if(hibernateVersion.equals("3.6")){
      compile project(':skif-store-server:skif-store-server-hs36')
