configurations {
    client
}

dependencies {
    compile project(':skif-store-test:skif-store-test-api')

    //tester disse implementasjonene her..
    if(hibernateVersion.equals("3.2")) {
      compile project(':skif-store-server:skif-store-server-hs32')
    } else if(hibernateVersion.equals("3.6")){
      compile project(':skif-store-server:skif-store-server-hs36')
    }

    provided libraries.weblogic

    testCompile project(':skif-testsupport-common')

    //internal dependencies + optional deps to logging frameworks:
    testCompile project(':skif-config')
}

task clientJar(type: Jar) {
    appendix = 'client'
    from sourceSets.main.output
}

artifacts {
//   archives clientJar
}

ideaModule {
    doFirst {
        //SKIF-239: legger inn vanlig driver + debugdriver inn i IntelliJ prosjektet for enkel manuell switching av rekkefølge på classpath.
        project.dependencies {
            provided libraries.ojdbc
            provided libraries.ojdbc_g
        }
    }
}