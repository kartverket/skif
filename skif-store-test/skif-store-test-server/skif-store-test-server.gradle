plugins {
    id 'java-library'
}

dependencies {
    api project(':skif-store-test:skif-store-test-api')
    api project(':skif-store-server')
    api(project(':skif-store-server')) {
        capabilities {
            requireCapability("no.statkart.skif:skif-store-server-jodatime-support")
        }
    }

    implementation enforcedPlatform(project(':skif-internal-platform'))
    implementation 'com.mchange:c3p0'
}
